name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  semgrep-scan:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Run Semgrep with OWASP rules
        run: |
          semgrep --config=semgrep_rules/owasp-python.yaml \
            --error \
            --verbose \
            --json \
            --output=semgrep-report.json || true

      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-report.json
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const results = JSON.parse(fs.readFileSync('semgrep-report.json', 'utf8'));

              if (results.results.length > 0) {
                const comment = `## 🔒 Semgrep Security Scan Results
                **Found ${results.results.length} security issues**

                ${results.results.map(r => `
                ### ${r.rule_id}
                - **Severity**: ${r.extra.severity}
                - **File**: \`${r.path}:${r.start.line}\`
                - **Message**: ${r.message}
                `).join('\n')}

                Please review and fix these issues before merging.
                `;

                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            } catch (e) {
              console.log('No results or error parsing:', e.message);
            }

  ai-security-scan:
    name: AI-Introduced Security Patterns Scan
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Run Semgrep with AI security rules
        run: |
          semgrep --config=semgrep_rules/ai-security.yaml \
            --error \
            --verbose \
            --json \
            --output=ai-security-report.json || true

      - name: Upload AI security results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-results
          path: ai-security-report.json
          retention-days: 30

      - name: Fail on AI-introduced vulnerabilities
        run: |
          if [ -f ai-security-report.json ]; then
            echo "🤖 Checking for AI-introduced security vulnerabilities..."

            # Count issues by severity
            CRITICAL=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' ai-security-report.json || echo 0)
            WARNING=$(jq '[.results[] | select(.extra.severity == "WARNING")] | length' ai-security-report.json || echo 0)

            echo "Found: $CRITICAL ERROR/WARNING severity issues"

            if [ "$CRITICAL" -gt 0 ]; then
              echo ""
              echo "❌ CRITICAL: AI-introduced security vulnerabilities detected!"
              echo ""
              echo "The following AI-generated patterns are NOT ALLOWED:"
              echo "  - Hardcoded credentials (passwords, API keys, secrets)"
              echo "  - shell=True in subprocess calls (command injection)"
              echo "  - text() with f-strings for SQL (SQL injection)"
              echo "  - pickle.loads() or yaml.load() (unsafe deserialization)"
              echo "  - eval() or exec() (code injection)"
              echo "  - Weak cryptography (MD5, SHA1)"
              echo "  - random.random() for secrets (use secrets module)"
              echo ""
              echo "Please review and fix these issues before merging."
              echo "Run locally: semgrep --config=semgrep_rules/ai-security.yaml"
              exit 1
            fi

            echo "✅ No critical AI-introduced vulnerabilities found"
            if [ "$WARNING" -gt 0 ]; then
              echo "⚠️  Warning: $WARNING warning-level issues found (review recommended)"
            fi
          fi

      - name: Comment PR with AI security results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const results = JSON.parse(fs.readFileSync('ai-security-report.json', 'utf8'));

              if (results.results.length > 0) {
                const issueCount = results.results.length;
                const resultsList = results.results.map(r => {
                  const parts = [
                    '### ' + r.rule_id,
                    '**Severity**: ' + (r.extra.severity || 'unknown'),
                    '**File**: `' + r.path + ':' + r.start.line + '`',
                    '**Message**: ' + r.message,
                    '**Remediation**: ' + (r.extra.remapped && r.extra.remapped.remediation || 'See OWASP guidelines')
                  ];
                  return parts.join('\n');
                }).join('\n\n');

                const comment = `## 🤖 AI-Introduced Security Pattern Scan Results

**Found ${issueCount} AI-generated security issues**

${resultsList}

**These patterns are commonly introduced by AI assistants.**
Please review and fix these issues before merging.
`;

                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            } catch (e) {
              console.log('No results or error parsing:', e.message);
            }

  security-tests:
    name: OWASP Security Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: psychsync_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov httpx
          pip install -r requirements.txt || true  # May fail if there are issues

      - name: Run security tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/psychsync_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-testing
          ENVIRONMENT: test
        run: |
          pytest tests/integration/test_owasp_security.py \
            -v \
            --tb=short \
            --cov=app/api/v1/endpoints \
            --cov-report=xml \
            --cov-report=html \
            || true

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-coverage
          path: |
            htmlcov/
            coverage.xml
          retention-days: 30

      - name: Fail on critical vulnerabilities
        if: steps.security_tests.outcome == 'failure'
        run: |
          echo "❌ Security tests failed - please review and fix"
          exit 1

  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install safety
        run: pip install safety

      - name: Run safety check
        run: |
          safety check --json --output safety-report.json || true
          safety check || true

      - name: Upload safety results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-vulnerabilities
          path: safety-report.json
          retention-days: 30

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --json

      - name: Upload secrets scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-results
          path: trufflehog-output.json
          retention-days: 7

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [semgrep-scan, ai-security-scan, security-tests, dependency-check, secret-scan]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate security report
        run: |
          echo "# 🔒 Security Scan Summary" > security-summary.md
          echo "" >> security-summary.md
          echo "**Date**: $(date)" >> security-summary.md
          echo "**Commit**: ${{ github.sha }}" >> security-summary.md
          echo "" >> security-summary.md
          echo "## Scan Results" >> security-summary.md
          echo "" >> security-summary.md
          echo "- ✅ Semgrep (OWASP): Completed" >> security-summary.md
          echo "- ✅ AI Security Scan: Completed" >> security-summary.md
          echo "- ✅ Security Tests: Completed" >> security-summary.md
          echo "- ✅ Dependency Check: Completed" >> security-summary.md
          echo "- ✅ Secret Scan: Completed" >> security-summary.md

          cat security-summary.md

      - name: Upload security summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.md
          retention-days: 90

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('security-summary.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  # Fail the workflow if any critical job failed
  check-results:
    name: Check Security Results
    runs-on: ubuntu-latest
    needs: [semgrep-scan, ai-security-scan, security-tests, dependency-check, secret-scan]
    if: always()

    steps:
      - name: Check for critical vulnerabilities
        run: |
          echo "Checking security scan results..."

          if [ "${{ needs.semgrep-scan.result }}" == "failure" ]; then
            echo "❌ CRITICAL: Semgrep found security issues"
            exit 1
          fi

          if [ "${{ needs.ai-security-scan.result }}" == "failure" ]; then
            echo "❌ CRITICAL: AI-introduced security patterns detected"
            exit 1
          fi

          if [ "${{ needs.secret-scan.result }}" == "failure" ]; then
            echo "❌ CRITICAL: Secrets detected in code"
            exit 1
          fi

          echo "✅ All critical security checks passed"
