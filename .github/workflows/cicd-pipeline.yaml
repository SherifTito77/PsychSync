################################################################################
# Comprehensive CI/CD Pipeline for PsychSync
# Platform: GitHub Actions
# Features: Tests, Static Analysis, Dependency Scanning, Artifact Storage
# Date: 2025-12-27
################################################################################

---
# WORKFLOW 1: Pull Request Validation (Fast Feedback)
name: PR Validation

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # Job 1: Code Quality Checks (Parallel)
  lint-python:
    name: Lint Python Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Ruff linter
      run: |
        ruff check . --output-format=github

    - name: Run Black formatter check
      run: |
        black --check .

    - name: Run isort import sorting check
      run: |
        isort --check-only .

    - name: Run mypy type checking
      run: |
        mypy app/

    - name: Run complexity analysis
      run: |
        pip install radon lizard
        radon cc app/ -a -s --total-average
        lizard app/ -w --CC 15

  lint-frontend:
    name: Lint Frontend Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Run TypeScript check
      run: npm run type-check

    - name: Check formatting with Prettier
      run: npm run format:check

  # Job 2: Security Scanning (Parallel)
  security-scan-python:
    name: Security Scan - Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Semgrep (SAST)
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          --config=semgrep_rules/owasp_*.yaml
          --severity=ERROR
          --severity=CRITICAL
        publishSarif: ${{ github.workspace }}/semgrep-results.sarif

    - name: Upload Semgrep results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: semgrep-results.sarif

    - name: Run Bandit (Python security linter)
      run: |
        pip install bandit[toml]
        bandit -r app/ -f json -o bandit-report.json || true

    - name: Upload Bandit results
      uses: actions/upload-artifact@v3
      with:
        name: bandit-report
        path: bandit-report.json

  security-scan-dependencies:
    name: Security Scan - Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Snyk (dependency scanning)
      continue-on-error: true
      uses: snyk/actions/python@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

    - name: Run Trivy (vulnerability scanner)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: trivy-results.sarif

  # Job 3: Run Tests (Parallel)
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: psychsync_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: psychsync_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term-missing

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --cov=app --cov-append --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: backend
        name: codecov-backend

    - name: Check coverage threshold
      run: |
        coverage report --fail-under=80

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm run test -- --coverage --maxWorkers=2

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./frontend/coverage/lcov.info
        flags: frontend
        name: codecov-frontend

  # Job 4: Build Artifacts
  build-artifacts:
    name: Build Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-python, lint-frontend, security-scan-python, test-backend, test-frontend]
    outputs:
      backend-image-tag: ${{ steps.build-backend.outputs.image-tag }}
      frontend-version: ${{ steps.build-frontend.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push backend image
      id: build-backend
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: psychsync/backend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build image
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

        # Push image
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

        # Output image tag
        echo "image-tag=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Build frontend bundle
      id: build-frontend
      env:
        NODE_VERSION: ${{ env.NODE_VERSION }}
      run: |
        cd frontend
        npm ci
        npm run build

        # Create version
        VERSION=$(node -p "require('./package.json').version")-${{ github.sha }}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

        # Upload to S3
        aws s3 sync dist/ s3://psychsync-frontend-artifacts/$VERSION/ --delete
        aws s3 cp s3://psychsync-frontend-artifacts/$VERSION/ s3://psychsync-frontend-artifacts/latest/ --recursive

    - name: Scan Docker image for vulnerabilities
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.build-backend.outputs.image-tag }}
        format: 'sarif'
        output: 'trivy-image-results.sarif'

    - name: Upload Trivy image scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: trivy-image-results.sarif

  # Job 5: Create PR Comment with Results
  pr-comment:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    if: always()
    permissions:
      pull-requests: write
    steps:
    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const botComment = comments.find(comment =>
            comment.user.type === 'Bot' &&
            comment.body.includes('### CI/CD Results')
          );

          const summary = `### CI/CD Results for PR #${context.issue.number}

          **Status:** ${{ needs.build-artifacts.result == 'success' ? '✅ Passed' : '❌ Failed' }}

          #### Build Artifacts
          - **Backend Image:** \`${{ needs.build-artifacts.outputs.backend-image-tag }}\`
          - **Frontend Version:** \`${{ needs.build-artifacts.outputs.frontend-version }}\`

          #### Security Scans
          - [Semgrep Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - [Trivy Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ---
          *Comment generated by GitHub Actions*`;

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: summary
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });
          }

---
# WORKFLOW 2: Build and Deploy to Staging
name: Build & Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY_BACKEND: psychsync/backend
  ECR_REPOSITORY_FRONTEND: psychsync/frontend
  KUBECONFIG: /tmp/kubeconfig-staging

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate version
      id: version
      run: |
        VERSION=$(git describe --tags --always --dirty)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push backend image
      env:
        IMAGE_TAG: ${{ steps.version.outputs.version }}
      run: |
        # Build backend image
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG \
                    $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:staging

        # Push to ECR
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:staging

    - name: Build and push frontend image
      run: |
        cd frontend
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG \
                    $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:staging

        docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:staging

    - name: Run comprehensive security scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_BACKEND }}:${{ steps.version.outputs.version }}
        format: 'table'
        exit-code: '1'
        severity: 'CRITICAL,HIGH'

    - name: Create SBOM (Software Bill of Materials)
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy image --format cyclonedx \
          $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG > sbom.json

        # Upload SBOM to S3
        aws s3 cp sbom.json s3://psychsync-sboms/$IMAGE_TAG.json

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: staging
      url: https://staging.psychsync.com
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure kubectl
      run: |
        aws eks update-kubeconfig --name psychsync-staging --region ${{ env.AWS_REGION }}
        kubectl config use-context arn:aws:eks:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:cluster/psychsync-staging

    - name: Update GitOps repository
      env:
        IMAGE_TAG: ${{ needs.build-and-test.outputs.version }}
        GITOPS_REPO: git@github.com:psychsync/psychsync-gitops.git
        GIT_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      run: |
        # Clone GitOps repo
        git clone https://x-access-token:${GIT_TOKEN}@github.com/psychsync/psychsync-gitops.git
        cd psychsync-gitops

        # Update backend image tag
        yq eval '.images[0].newTag = strenv(IMAGE_TAG)' \
          -i apps/psychsync-backend/overlays/staging/kustomization.yaml

        # Update frontend image tag
        yq eval '.images[0].newTag = strenv(IMAGE_TAG)' \
          -i apps/psychsync-frontend/overlays/staging/kustomization.yaml

        # Commit and push
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git commit -am "Deploy $IMAGE_TAG to staging"
        git push

    - name: Wait for ArgoCD sync
      env:
        ARGOCD_SERVER: argocd.psychsync.com
        ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
      run: |
        # Wait for sync to complete
        argocd app sync psychsync-backend-staging --timeout 600
        argocd app wait psychsync-backend-staging --health

    - name: Run smoke tests
      run: |
        # Install dependencies
        pip install requests pytest

        # Run smoke tests
        pytest tests/smoke/staging.py --url=https://staging.psychsync.com

    - name: Notify Slack
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          Deployed version `${{ needs.build-and-test.outputs.version }}` to staging
          Status: ${{ job.status }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      if: always()

---
# WORKFLOW 3: Deploy to Production (with Approval Gates)
name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (leave empty for latest)'
        required: false
        default: ''

env:
  AWS_REGION: us-east-1

jobs:
  pre-deployment-checks:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    outputs:
      can_proceed: ${{ steps.checks.outputs.can_proceed }}
    steps:
    - name: Run production readiness checks
      id: checks
      run: |
        # Check if staging is healthy
        STAGING_HEALTH=$(curl -s https://staging.psychsync.com/health | jq -r '.status')

        if [ "$STAGING_HEALTH" != "ok" ]; then
          echo "Staging is not healthy, aborting production deployment"
          echo "can_proceed=false" >> $GITHUB_OUTPUT
          exit 1
        fi

        # Check if there are no critical security vulnerabilities
        # Check if all tests pass
        # Check if backups are current
        # Check if monitoring is operational

        echo "can_proceed=true" >> $GITHUB_OUTPUT

    - name: Notify team
      uses: 8398a7/action-slack@v3
      with:
        text: |
          Production deployment checks passed. Ready for deployment.
          Awaiting approval from: @psychsync-oncall
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # APPROVAL GATE 1: Manual Approval
  approval-production:
    name: Approval - Production Deployment
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    if: needs.pre-deployment-checks.outputs.can_proceed == 'true'
    environment:
      name: production
      url: https://psychsync.com
    steps:
    - name: Await approval
      run: |
        echo "Awaiting manual approval for production deployment..."
        echo "Approvers: @psychsync-oncall @psychsync-lead @psychsync-cto"

  # APPROVAL GATE 2: Automated Gates
  automated-gates:
    name: Automated Quality Gates
    runs-on: ubuntu-latest
    needs: approval-production
    outputs:
      gates_passed: ${{ steps.gates.outputs.gates_passed }}
    steps:
    - name: Check quality gates
      id: gates
      run: |
        GATES_PASSED=true

        # Gate 1: Test coverage >= 80%
        COVERAGE=$(curl -s https://codecov.io/api/v2/github/psychsync/psychsync/branch/main | jq -r '.coverage')
        if (( $(echo "$COVERAGE < 0.8" | bc -l) )); then
          echo "Coverage gate failed: $COVERAGE < 80%"
          GATES_PASSED=false
        fi

        # Gate 2: No critical vulnerabilities
        CRITICAL_VULNS=$(trivy image --severity CRITICAL --format json $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest | jq '.Results[].Vulnerabilities | length')
        if [ "$CRITICAL_VULNS" -gt 0 ]; then
          echo "Security gate failed: $CRITICAL_VULNS critical vulnerabilities"
          GATES_PASSED=false
        fi

        # Gate 3: Staging uptime >= 99%
        # Gate 4: Error rate < 0.1%
        # Gate 5: P95 latency < 500ms

        echo "gates_passed=$GATES_PASSED" >> $GITHUB_OUTPUT

        if [ "$GATES_PASSED" != "true" ]; then
          echo "Quality gates failed, aborting deployment"
          exit 1
        fi

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: automated-gates
    if: needs.automated-gates.outputs.gates_passed == 'true'
    environment:
      name: production
      url: https://psychsync.com
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure kubectl
      run: |
        aws eks update-kubeconfig --name psychsync-production --region ${{ env.AWS_REGION }}

    - name: Create deployment marker
      run: |
        echo "DEPLOYMENT_VERSION=${{ github.event.inputs.version || 'latest' }}" >> $GITHUB_ENV
        echo "DEPLOYMENT_TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

    - name: Update GitOps repository
      env:
        VERSION: ${{ github.event.inputs.version }}
        GIT_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      run: |
        git clone https://x-access-token:${GIT_TOKEN}@github.com/psychsync/psychsync-gitops.git
        cd psychsync-gitops

        # Update image tag
        if [ -n "$VERSION" ]; then
          yq eval '.images[0].newTag = strenv(VERSION)' \
            -i apps/psychsync-backend/overlays/production/kustomization.yaml
        else
          # Use latest from ECR
          LATEST_TAG=$(aws ecr describe-images --repository-name psychsync/backend --query 'sort_by(imagePushedAt, &desc)[0].imageTags[0]' --output text)
          yq eval '.images[0].newTag = strenv(LATEST_TAG)' \
            -i apps/psychsync-backend/overlays/production/kustomization.yaml
        fi

        # Add deployment annotation
        yq eval '.metadata.annotations."deployment.psychsync.com/version" = strenv(DEPLOYMENT_VERSION)' \
          -i apps/psychsync-backend/overlays/production/deployment.yaml
        yq eval '.metadata.annotations."deployment.psychsync.com/timestamp" = strenv(DEPLOYMENT_TIMESTAMP)' \
          -i apps/psychsync-backend/overlays/production/deployment.yaml

        git commit -am "Deploy $VERSION to production"
        git push

    - name: Trigger ArgoCD sync
      env:
        ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
      run: |
        # Sync with ArgoCD
        argocd app sync psychsync-backend-production --timeout 900

        # Wait for healthy state
        argocd app wait psychsync-backend-production --health --timeout 900

    - name: Run production smoke tests
      run: |
        pip install pytest requests
        pytest tests/smoke/production.py --url=https://psychsync.com --timeout=300

    - name: Mark deployment successful
      if: success()
      run: |
        # Update deployment status
        curl -X POST https://api.psychsync.com/deployments/${{ env.DEPLOYMENT_TIMESTAMP }}/success

        # Create GitHub release
        gh release create ${{ env.DEPLOYMENT_VERSION }} \
          --notes "Production deployment ${{ env.DEPLOYMENT_TIMESTAMP }}" \
          --target main

    - name: Notify on success
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          ✅ Production deployment successful!
          Version: ${{ env.DEPLOYMENT_VERSION }}
          Timestamp: ${{ env.DEPLOYMENT_TIMESTAMP }}
          URL: https://psychsync.com
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      if: success()

    - name: Notify on failure
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          ❌ Production deployment FAILED!
          Version: ${{ env.DEPLOYMENT_VERSION }}
          Timestamp: ${{ env.DEPLOYMENT_TIMESTAMP }}
          Requires immediate attention!
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      if: failure()

---
# WORKFLOW 4: Rollback on Failure
name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rollback to'
        required: true

jobs:
  rollback-production:
    name: Rollback Production
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
    - name: Checkout GitOps repository
      uses: actions/checkout@v4
      with:
        repository: psychsync/psychsync-gitops
        token: ${{ secrets.GITOPS_TOKEN }}

    - name: Rollback to previous version
      env:
        ROLLBACK_VERSION: ${{ github.event.inputs.version }}
      run: |
        # Update image tag to previous version
        yq eval '.images[0].newTag = strenv(ROLLBACK_VERSION)' \
          -i apps/psychsync-backend/overlays/production/kustomization.yaml

        # Commit and push
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git commit -am "Rollback to $ROLLBACK_VERSION"
        git push

    - name: Trigger ArgoCD sync
      env:
        ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
      run: |
        argocd app sync psychsync-backend-production --timeout 900
        argocd app wait psychsync-backend-production --health --timeout 900

    - name: Verify rollback
      run: |
        pip install pytest requests
        pytest tests/smoke/production.py --url=https://psychsync.com

    - name: Notify rollback
      uses: 8398a7/action-slack@v3
      with:
        text: |
          ⚠️ PRODUCTION ROLLBACK performed!
          Rolled back to: ${{ github.event.inputs.version }}
          Requires investigation!
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

---
# WORKFLOW 5: Nightly Build and Maintenance
name: Nightly Build and Maintenance

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily
  workflow_dispatch:

jobs:
  nightly-security-scan:
    name: Comprehensive Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run comprehensive security scan
      run: |
        # Full SAST scan
        semgrep --config=semgrep_rules/ --json --output=semgrep-nightly.json

        # Full dependency scan
        pip install safety
        safety check --json > safety-report.json

        # Container vulnerability scan
        trivy image --severity HIGH,CRITICAL --json \
          psychsync/backend:latest > trivy-nightly.json

    - name: Generate security report
      run: |
        python scripts/generate-security-report.py \
          --semgrep semgrep-nightly.json \
          --safety safety-report.json \
          --trivy trivy-nightly.json \
          --output security-report-$(date +%Y%m%d).html

    - name: Upload reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          semgrep-nightly.json
          safety-report.json
          trivy-nightly.json
          security-report-*.html

    - name: Create GitHub issue if vulnerabilities found
      uses: actions/github-script@v7
      if: failure()
      with:
        script: |
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('safety-report.json', 'utf8'));

          if (report.length > 0) {
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security vulnerabilities detected - ${new Date().toISOString().split('T')[0]}`,
              body: `Nightly security scan detected ${report.length} vulnerabilities.\n\nSee artifacts for details.`,
              labels: ['security', 'automated']
            });
          }
