name: Architecture Validation

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:  # Allow manual triggering

jobs:
  validate-architecture:
    name: Validate Architecture Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install any additional dependencies needed for validation
          pip install ast-glob

      - name: Run architecture validation
        id: validate
        run: |
          echo "Running architecture validation..."
          python scripts/validate_architecture.py > architecture_report.txt 2>&1
          exit_code=$?
          echo "Exit code: $exit_code"

          # Upload report regardless of exit code
          echo "ARCHITECTURE_REPORT<<EOF" >> $GITHUB_STEP_SUMMARY
          cat architecture_report.txt
          echo "EOF" >> $GITHUB_STEP_SUMMARY

          # Exit with the validation script's exit code
          exit $exit_code
        continue-on-error: false

      - name: Check for critical issues
        if: always()
        run: |
          if grep -q "CRITICAL ISSUES FOUND" architecture_report.txt; then
            echo "::error::Critical architectural issues detected!"
            exit 1
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: architecture-validation-report
          path: architecture_report.txt
          retention-days: 30

      - name: Create trend comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('architecture_report.txt', 'utf8');

            // Extract metrics
            const totalMatch = report.match(/Total Issues: (\d+)/);
            const criticalMatch = report.match(/Critical Issues: (\d+)/);

            const totalIssues = totalMatch ? totalMatch[1] : '0';
            const criticalIssues = criticalMatch ? criticalMatch[1] : '0';

            // Create comment
            const comment = `## 🔍 Architecture Validation Results

            | Metric | Count |
            |--------|-------|
            | Total Issues | ${totalIssues} |
            | Critical Issues | ${criticalIssues} |

            ${criticalIssues > 0 ? '⚠️ **Critical issues detected!** Please review the full report.' : '✅ No critical issues found!'}

            <details>
            <summary>View Full Report</summary>

            \`\`\`
            ${report}
            \`\`\`
            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  track-trends:
    name: Track Architecture Trends
    runs-on: ubuntu-latest
    needs: validate-architecture
    if: github.event_name == 'push' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download previous metrics
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: architecture-validation.yml
          name: architecture-metrics
          path: .metrics-history
        continue-on-error: true

      - name: Extract current metrics
        run: |
          # Extract metrics from report
          TOTAL=$(grep "Total Issues:" architecture_report.txt | awk '{print $3}')
          CRITICAL=$(grep "Critical Issues:" architecture_report.txt | awk '{print $3}')

          echo "total_issues=$TOTAL" >> $GITHUB_ENV
          echo "critical_issues=$CRITICAL" >> $GITHUB_ENV

          # Save to metrics file
          cat > metrics.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "total_issues": $TOTAL,
            "critical_issues": $CRITICAL,
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}"
          }
          EOF

      - name: Upload metrics for next time
        uses: actions/upload-artifact@v3
        with:
          name: architecture-metrics
          path: metrics.json
          retention-days: 90

      - name: Generate trend report
        run: |
          echo "# Architecture Trends" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Current | Trend |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Issues | ${{ env.total_issues }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Critical Issues | ${{ env.critical_issues }} | - |" >> $GITHUB_STEP_SUMMARY

  notify-on-failure:
    name: Notify on Critical Issues
    runs-on: ubuntu-latest
    needs: validate-architecture
    if: failure()

    steps:
      - name: Send notification
        run: |
          # Add your notification logic here (Slack, email, etc.)
          echo "Critical architectural issues detected - notification sent"
          # Example: curl to Slack webhook
          # curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"⚠️ Critical architectural issues detected in build ${{ github.sha }}"}'
