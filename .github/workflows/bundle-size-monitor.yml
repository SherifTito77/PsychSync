name: Bundle Size Monitor

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  bundle-size:
    name: Monitor Bundle Size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          CI: true

      - name: Run bundle size monitor
        working-directory: ./frontend
        run: |
          chmod +x scripts/monitor-bundle-size.sh
          ./scripts/monitor-bundle-size.sh

      - name: Comment PR with bundle size changes
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Check if bundle sizes file exists
            const sizesFile = path.join('./frontend', '.bundle-sizes.json');
            if (!fs.existsSync(sizesFile)) {
              console.log('No bundle sizes file found');
              return;
            }

            const sizes = fs.readFileSync(sizesFile, 'utf8');
            const data = sizes.split('\n').reduce((acc, line) => {
              const [key, value] = line.split(':');
              if (key && value) {
                acc[key] = parseInt(value);
              }
              return acc;
            }, {});

            // Format bytes
            const formatBytes = (bytes) => {
              if (bytes < 1024) return `${bytes}B`;
              if (bytes < 1048576) return `${(bytes / 1024).toFixed(2)}KB`;
              return `${(bytes / 1048576).toFixed(2)}MB`;
            };

            // Create comment
            const comment = `## 📦 Bundle Size Report

            | Metric | Size |
            |--------|------|
            | **JavaScript** | ${formatBytes(data.js || 0)} |
            | **CSS** | ${formatBytes(data.css || 0)} |
            | **Total** | **${formatBytes(data.total || 0)}** |

            ---
            💡 This comment is automatically generated by the Bundle Size Monitor workflow.
            `;

            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload bundle size artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-sizes
          path: frontend/.bundle-sizes.json
          retention-days: 30

      - name: Check bundle size limits
        working-directory: ./frontend
        run: |
          # Read the sizes file
          if [ -f ".bundle-sizes.json" ]; then
            total_size=$(cat .bundle-sizes.json | grep "total" | cut -d: -f2)

            # Convert to KB
            total_kb=$((total_size / 1024))

            # Check against limit (500KB)
            if [ $total_kb -gt 500 ]; then
              echo "❌ Bundle size exceeds 500KB limit"
              echo "Current size: $total_kb KB"
              exit 1
            else
              echo "✅ Bundle size within acceptable limits"
            fi
          fi

      - name: Build summary
        run: |
          echo "### Bundle Size Analysis :package:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The build completed successfully. Check the bundle size report above for details." >> $GITHUB_STEP_SUMMARY
