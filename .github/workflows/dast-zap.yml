name: DAST - OWASP ZAP Security Scan

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL for ZAP scan'
        required: true
        default: 'https://staging.psychsync.com'
  schedule:
    # Run DAST scan daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write

env:
  ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}
  TARGET_URL: ${{ github.event.inputs.target_url || 'https://staging.psychsync.com' }}

jobs:
  zap-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create ZAP workspace
        run: |
          mkdir -p zap-results
          echo "ZAP workspace created"

      - name: Run ZAP Baseline Scan
        run: |
          docker run --name zap -t \
            -v $(pwd)/zap-results:/zap/wrk:rw \
            -w /zap \
            zaproxy/zap-stable:latest \
            zap-baseline.py \
              -t ${{ env.TARGET_URL }} \
              -g gen.conf \
              -r zap-report.html \
              -w zap-report.md \
              -x zap-report.xml \
              -J \
              --hook=/zap/auth_header.py \
              --auth_header="Authorization: Bearer ${{ secrets.STAGING_AUTH_TOKEN }}" \
              || true

          # Copy results out of container
          docker cp zap:/zap/wrk/zap-report.html zap-results/ || true
          docker cp zap:/zap/wrk/zap-report.md zap-results/ || true
          docker cp zap:/zap/wrk/zap-report.xml zap-results/ || true

      - name: Stop ZAP container
        run: |
          docker stop zap || true
          docker rm zap || true

      - name: Parse ZAP results
        id: parse_results
        run: |
          echo "## 🔍 OWASP ZAP DAST Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ env.TARGET_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f zap-results/zap-report.xml ]; then
            # Parse XML report
            high=$(xmllint --xpath "count(//alert[level('OWASP 2021') and riskcode='3'])" zap-results/zap-report.xml 2>/dev/null || echo "0")
            medium=$(xmllint --xpath "count(//alert[level('OWASP 2021') and riskcode='2'])" zap-results/zap-report.xml 2>/dev/null || echo "0")
            low=$(xmllint --xpath "count(//alert[level('OWASP 2021') and riskcode='1'])" zap-results/zap-report.xml 2>/dev/null || echo "0")
            informational=$(xmllint --xpath "count(//alert[level('OWASP 2021') and riskcode='0'])" zap-results/zap-report.xml 2>/dev/null || echo "0")

            # Write to summary
            echo "### 📊 Findings Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 High | $high |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 Medium | $medium |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Low | $low |" >> $GITHUB_STEP_SUMMARY
            echo "| ℹ️ Info | $informational |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Set output for fail condition
            echo "high=$high" >> $GITHUB_OUTPUT
            echo "medium=$medium" >> $GITHUB_OUTPUT
            echo "total=$((high + medium + low + informational))" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Warning: ZAP report not found" >> $GITHUB_STEP_SUMMARY
            echo "high=0" >> $GITHUB_OUTPUT
            echo "medium=0" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
          fi

      - name: Fail on high severity
        if: steps.parse_results.outputs.high != '0'
        run: |
          echo "::error::ZAP found ${{ steps.parse_results.outputs.high }} high-severity issues!"
          echo "### ❌ DAST Scan Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Found ${{ steps.parse_results.outputs.high }} high-severity security issues." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action Required:** Review and fix findings before deploying to production." >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Generate SARIF
        if: always()
        run: |
          # Convert ZAP XML to SARIF format
          if [ -f zap-results/zap-report.xml ]; then
            python3 .github/scripts/zap-to-sarif.py \
              --input zap-results/zap-report.xml \
              --output zap-results/zap.sarif \
              --target-url "${{ env.TARGET_URL }}" || true
          fi

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: zap-results/zap.sarif

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: |
            zap-results/zap-report.html
            zap-results/zap-report.md
            zap-results/zap-report.xml
            zap-results/zap.sarif
          retention-days: 30

      - name: Comment on commit (if on main/develop)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = `${{ steps.parse_results.outputs.high }} high, ${{ steps.parse_results.outputs.medium }} medium severity issues found in DAST scan`;

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `### 🔍 DAST Scan Results

**Target:** ${{ env.TARGET_URL }}
**Findings:** ${summary}

📊 **Full Report:** Check the workflow artifacts for detailed ZAP scan results.`
            });

  zap-full-scan:
    name: OWASP ZAP Full Scan (Weekly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ZAP Full Scan
        run: |
          docker run --name zap-full -t \
            -v $(pwd)/zap-results:/zap/wrk:rw \
            -w /zap \
            zaproxy/zap-stable:latest \
            zap-full-scan.py \
              -t ${{ env.TARGET_URL }} \
              -r zap-full-report.html \
              -w zap-full-report.md \
              -x zap-full-report.xml \
              --hook=/zap/auth_header.py \
              --auth_header="Authorization: Bearer ${{ secrets.STAGING_AUTH_TOKEN }}" \
              || true

          docker cp zap-full:/zap/wrk/zap-full-report.html zap-results/ || true
          docker cp zap-full:/zap/wrk/zap-full-report.md zap-results/ || true
          docker cp zap-full:/zap/wrk/zap-full-report.xml zap-results/ || true

      - name: Stop ZAP container
        run: |
          docker stop zap-full || true
          docker rm zap-full || true

      - name: Upload full scan results
        uses: actions/upload-artifact@v4
        with:
          name: zap-full-scan-report
          path: |
            zap-results/zap-full-report.html
            zap-results/zap-full-report.md
            zap-results/zap-full-report.xml
          retention-days: 90

  security-dashboard:
    name: Update Security Dashboard
    needs: [zap-scan]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Update dashboard
        run: |
          echo "## 🔐 Security Dashboard - DAST" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### OWASP ZAP Scan History" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Date | Branch | High | Medium | Low |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| $(date +%Y-%m-%d) | ${{ github.ref_name }} | ${{ steps.parse_results.outputs.high }} | ${{ steps.parse_results.outputs.medium }} | ${{ steps.parse_results.outputs.low }} |" >> $GITHUB_STEP_SUMMARY
