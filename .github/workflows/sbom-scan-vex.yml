# SBOM Generation and Vulnerability Scanning Workflow
# Generates CycloneDX SBOMs and scans for vulnerabilities

name: SBOM Scan and VEX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'frontend/package.json'
      - '**/*.py'
      - '**/*.ts'
      - '**/*.tsx'
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 10:00 AM UTC
    - cron: '0 10 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  generate-sboms:
    name: Generate SBOMs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || true
          fi

      - name: Generate Python SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          pip install cyclonedx-python

          # Create SBOM directory
          mkdir -p sbom

          # Generate Python SBOM
          if [ -f requirements.txt ]; then
            cyclonedx-py -r requirements.txt -o sbom/backend-python.cdx.json || true

            # Validate SBOM has required fields
            if [ -f sbom/backend-python.cdx.json ]; then
              echo "✓ Python SBOM generated successfully"
              ls -lh sbom/backend-python.cdx.json
            else
              echo "⚠ Python SBOM generation skipped"
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate Node.js SBOM
        run: |
          cd frontend

          # Install dependencies if needed
          if [ -f package-lock.json ]; then
            npm ci || npm install
          fi

          # Install CycloneDX
          npm install -g @cyclonedx/cyclonedx-bom || true

          # Create SBOM directory
          mkdir -p ../sbom

          # Generate Node.js SBOM
          if [ -f package.json ]; then
            cyclonedx-bom -o ../sbom/frontend-node.cdx.json || true

            if [ -f ../sbom/frontend-node.cdx.json ]; then
              echo "✓ Node.js SBOM generated successfully"
              ls -lh ../sbom/frontend-node.cdx.json
            else
              echo "⚠ Node.js SBOM generation skipped"
            fi
          fi

      - name: Upload SBOMs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: sbom/
          retention-days: 90

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: generate-sboms

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download SBOMs
        uses: actions/download-artifact@v4
        with:
          name: sboms
          path: sbom/

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate summary report
        if: always()
        run: |
          echo "# Vulnerability Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## SBOMs Generated" >> $GITHUB_STEP_SUMMARY
          ls -lh sbom/ >> $GITHUB_STEP_SUMMARY || echo "No SBOMs found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-results.sarif ]; then
            echo "✓ Trivy scan completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠ Scan results not available" >> $GITHUB_STEP_SUMMARY
          fi
