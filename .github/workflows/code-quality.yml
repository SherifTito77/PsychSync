name: Code Quality Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  # PR size limits
  MAX_PR_LINES_CHANGED: 1000
  MAX_PR_FILES_CHANGED: 20

jobs:
  pr-size-check:
    name: PR Size Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR changes
        id: pr-changes
        run: |
          echo "Fetching PR changes..."
          git fetch origin ${{ github.base_ref }}
          LINES_CHANGED=$(git diff --shortstat origin/$GITHUB_BASE_REF...HEAD | tail -1 | awk '{print $4 + $6}')
          FILES_CHANGED=$(git diff --name-only origin/$GITHUB_BASE_REF...HEAD | wc -l)

          echo "lines_changed=$LINES_CHANGED" >> $GITHUB_ENV
          echo "files_changed=$FILES_CHANGED" >> $GITHUB_ENV

          echo "📊 PR Statistics:"
          echo "  Lines changed: $LINES_CHANGED"
          echo "  Files changed: $FILES_CHANGED"

      - name: Check PR size limits
        run: |
          echo "🔍 Checking PR size against limits..."
          echo "  Max lines changed: ${{ env.MAX_PR_LINES_CHANGED }}"
          echo "  Max files changed: ${{ env.MAX_PR_FILES_CHANGED }}"
          echo ""

          # Check if PR is too large
          if [ "${{ env.lines_changed }}" -gt "${{ env.MAX_PR_LINES_CHANGED }}" ]; then
            echo "❌ PR exceeds line limit!"
            echo "   Changed: ${{ env.lines_changed }} lines"
            echo "   Limit: ${{ env.MAX_PR_LINES_CHANGED }} lines"
            echo ""
            echo "💡 Consider splitting this PR into smaller, focused changes."
            exit 1
          fi

          if [ "${{ env.files_changed }}" -gt "${{ env.MAX_PR_FILES_CHANGED }}" ]; then
            echo "❌ PR exceeds file limit!"
            echo "   Changed: ${{ env.files_changed }} files"
            echo "   Limit: ${{ env.MAX_PR_FILES_CHANGED }} files"
            echo ""
            echo "💡 Consider splitting this PR or reducing scope."
            exit 1
          fi

          echo "✅ PR size within acceptable limits!"
          echo "   Lines changed: ${{ env.lines_changed }} / ${{ env.MAX_PR_LINES_CHANGED }}"
          echo "   Files changed: ${{ env.files_changed }} / ${{ env.MAX_PR_FILES_CHANGED }}"

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const linesChanged = '${{ env.lines_changed }}';
            const filesChanged = '${{ env.files_changed }}';

            let comment = `## 🔍 PR Size Check\n\n`;
            comment += `- **Lines changed**: ${linesChanged} / ${{ env.MAX_PR_LINES_CHANGED }}\n`;
            comment += `- **Files changed**: ${filesChanged} / ${{ env.MAX_PR_FILES_CHANGED }}\n\n`;

            if (linesChanged > ${{ env.MAX_PR_LINES_CHANGED }} || filesChanged > ${{ env.MAX_PR_FILES_CHANGED }}) {
              comment += `⚠️ **Warning**: This PR is large and may be difficult to review.\n\n`;
              comment += `💡 **Recommendations**:\n`;
              comment += `1. Split into smaller, focused PRs\n`;
              comment += `2. Reduce scope if possible\n`;
              comment += `3. Ensure each file has a clear, single purpose\n`;
            } else {
              comment += `✅ **Passed**: PR size is within acceptable limits!\n\n`;
              comment += `🎉 Great job keeping changes focused and reviewable!`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  import-complexity:
    name: Import Complexity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Add any required dependencies here

      - name: Check import complexity
        run: |
          echo "🔍 Checking import complexity..."
          python scripts/check_import_complexity.py \
            --max-imports 25 \
            --fail-on-warnings

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-complexity-results
          path: |
            scripts/check_import_complexity.py

  file-growth-monitor:
    name: File Growth Monitor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check file growth
        run: |
          echo "📊 Monitoring file growth..."
          python scripts/monitor_file_growth.py

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Read the file growth monitor output and comment on PR
            // This is a placeholder - actual implementation would parse output

  circular-dependencies:
    name: Circular Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for circular dependencies
        run: |
          echo("🔄 Checking for circular dependencies...")
          python3 << 'EOF'
          import os
          import sys
          from collections import defaultdict

          def analyze_imports(app_dir):
              graph = defaultdict(set)
              for root, dirs, files in os.walk(app_dir):
                  dirs[:] = [d for d in dirs if not d.startswith('.') and d != '__pycache__']
                  for file in files:
                      if file.endswith('.py') and not file.startswith('__'):
                          file_path = os.path.join(root, file)
                          rel_path = os.path.relpath(file_path, app_dir)
                          module_name = rel_path.replace('.py', '').replace(os.sep, '.')
                          # Simple import detection
                          try:
                              with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                                  for line in f:
                                      if line.startswith('from app.'):
                                          imported = line.split()[1].replace('app.', '')
                                          graph[module_name].add(imported)
                          except:
                              pass
              return graph

          graph = analyze_imports('app')

          # Detect cycles
          def has_cycles(graph, node, visited=None, rec_stack=None):
              if visited is None:
                  visited = set()
              if rec_stack is None:
                  rec_stack = set()

              visited.add(node)
              rec_stack.add(node)

              for neighbor in graph.get(node, []):
                  if neighbor not in visited:
                      if has_cycles(graph, neighbor, visited, rec_stack):
                          return True
                  elif neighbor in rec_stack:
                      return True

              rec_stack.remove(node)
              return False

          cycles_found = False
          for node in graph:
              if has_cycles(graph, node):
                  cycles_found = True
                  print(f"❌ Circular dependency detected involving: {node}")

          if not cycles_found:
              print("✅ No circular dependencies detected!")
              sys.exit(0)
          else:
              print("❌ Circular dependencies found!")
              sys.exit(1)
          EOF

  complexity-report:
    name: Generate Complexity Report
    runs-on: ubuntu-latest
    needs: [import-complexity, file-growth-monitor]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate comprehensive report
        run: |
          echo "📋 Generating comprehensive code quality report..."
          echo "" > quality-report.txt
          echo "# Code Quality Report" >> quality-report.txt
          echo "Generated: $(date)" >> quality-report.txt
          echo "" >> quality-report.txt
          echo "## Import Complexity" >> quality-report.txt
          python scripts/check_import_complexity.py >> quality-report.txt 2>&1 || true
          echo "" >> quality-report.txt
          echo "## File Growth" >> quality-report.txt
          python scripts/monitor_file_growth.py >> quality-report.txt 2>&1 || true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-report
          path: quality-report.txt
          retention-days: 30

  summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [pr-size-check, import-complexity, file-growth-monitor, circular-dependencies]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "# ✅ Code Quality Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- PR Size Check: ${{ needs.pr-size-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Import Complexity: ${{ needs.import-complexity.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- File Growth: ${{ needs.file-growth-monitor.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Circular Dependencies: ${{ needs.circular-dependencies.result }}" >> $GITHUB_STEP_SUMMARY
