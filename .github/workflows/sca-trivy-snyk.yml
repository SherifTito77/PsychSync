name: SCA - Dependency Vulnerability Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of scan (full/quick)'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - full
  schedule:
    # Run full dependency scan daily at 3 AM UTC
    - cron: '0 3 * * *'

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CycloneDX
        run: |
          pip install cyclonedx-bom

      - name: Generate Python SBOM
        run: |
          cyclonedx-py --format json --output sbom-python.json

      - name: Generate Node.js SBOM
        working-directory: frontend
        run: |
          npm install -g @cyclonedx/cyclonedx-cli
          cyclonedx-bom -o sbom-frontend.json

      - name: Merge SBOMs
        run: |
          python3 .github/scripts/merge-sboms.py \
            --python sbom-python.json \
            --frontend frontend/sbom-frontend.json \
            --output sbom.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.json
            sbom-python.json
            frontend/sbom-frontend.json
          retention-days: 90

  trivy-scan:
    name: Trivy Vulnerability Scan
    needs: generate-sbom
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'sbom'
          scan-ref: 'sbom.json'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Parse Trivy results
        id: parse_trivy
        run: |
          echo "## 🔍 Trivy SCA Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f trivy-results.sarif ]; then
            critical=$(jq '[.runs[0].results[] | select(.ruleId | contains("CRITICAL"))] | length' trivy-results.sarif 2>/dev/null || echo "0")
            high=$(jq '[.runs[0].results[] | select(.ruleId | contains("HIGH"))] | length' trivy-results.sarif 2>/dev/null || echo "0")
            medium=$(jq '[.runs[0].results[] | select(.ruleId | contains("MEDIUM"))] | length' trivy-results.sarif 2>/dev/null || echo "0")

            echo "### 📊 Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 Critical | $critical |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 High | $high |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Medium | $medium |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "critical=$critical" >> $GITHUB_OUTPUT
            echo "high=$high" >> $GITHUB_OUTPUT
            echo "medium=$medium" >> $GITHUB_OUTPUT
          else
            echo "✅ No vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
            echo "critical=0" >> $GITHUB_OUTPUT
            echo "high=0" >> $GITHUB_OUTPUT
            echo "medium=0" >> $GITHUB_OUTPUT
          fi

      - name: Fail on critical/high severity
        if: steps.parse_trivy.outputs.critical != '0' || steps.parse_trivy.outputs.high != '0'
        run: |
          total_vulns=$((${{ steps.parse_trivy.outputs.critical }} + ${{ steps.parse_trivy.outputs.high }}))
          echo "::error::Trivy found $total_vulns critical/high vulnerabilities!"
          echo "### ❌ SCA Scan Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Found ${{ steps.parse_trivy.outputs.critical }} critical and ${{ steps.parse_trivy.outputs.high }} high-severity vulnerabilities." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action Required:** Update dependencies or create security exemptions." >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.sarif
          retention-days: 30

  snyk-scan:
    name: Snyk Vulnerability Scan
    needs: generate-sbom
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.scan_type == 'full'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Snyk scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk-results.sarif
          command: test

      - name: Parse Snyk results
        id: parse_snyk
        run: |
          echo "## 🔍 Snyk SCA Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f snyk-results.sarif ]; then
            critical=$(jq '[.runs[0].results[] | select(.level == "error")] | length' snyk-results.sarif 2>/dev/null || echo "0")
            high=$(jq '[.runs[0].results[] | select(.level == "error")] | length' snyk-results.sarif 2>/dev/null || echo "0")
            medium=$(jq '[.runs[0].results[] | select(.level == "warning")] | length' snyk-results.sarif 2>/dev/null || echo "0")

            echo "### 📊 Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 Critical | $critical |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 High | $high |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Medium | $medium |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Snyk SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-results.sarif

      - name: Upload Snyk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-scan-results
          path: snyk-results.sarif
          retention-days: 30

  npm-audit:
    name: npm Audit (Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit
        working-directory: frontend
        run: |
          npm audit --production --json > npm-audit-results.json || true

      - name: Parse npm audit results
        id: parse_npm
        run: |
          cd frontend
          echo "## 🔍 npm Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f npm-audit-results.json ]; then
            critical=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit-results.json)
            high=$(jq '.metadata.vulnerabilities.high // 0' npm-audit-results.json)
            moderate=$(jq '.metadata.vulnerabilities.moderate // 0' npm-audit-results.json)
            low=$(jq '.metadata.vulnerabilities.low // 0' npm-audit-results.json)

            echo "### 📊 Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 Critical | $critical |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 High | $high |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Moderate | $moderate |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟢 Low | $low |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            total_critical_high=$((critical + high))

            if [ "$total_critical_high" -gt 0 ]; then
              echo "critical=$critical" >> $GITHUB_OUTPUT
              echo "high=$high" >> $GITHUB_OUTPUT
            else
              echo "critical=0" >> $GITHUB_OUTPUT
              echo "high=0" >> $GITHUB_OUTPUT
            fi
          else
            echo "✅ No vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
            echo "critical=0" >> $GITHUB_OUTPUT
            echo "high=0" >> $GITHUB_OUTPUT
          fi

      - name: Fail on critical/high
        if: steps.parse_npm.outputs.critical != '0' || steps.parse_npm.outputs.high != '0'
        run: |
          echo "::error::npm audit found ${{ steps.parse_npm.outputs.critical }} critical and ${{ steps.parse_npm.outputs.high }} high severity vulnerabilities!"
          exit 1

      - name: Upload npm audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: frontend/npm-audit-results.json
          retention-days: 30

  safety-check:
    name: Safety Check (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Safety
        run: |
          pip install safety

      - name: Run Safety check
        run: |
          safety check --json > safety-results.json || true

      - name: Parse Safety results
        id: parse_safety
        run: |
          echo "## 🔍 Safety Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f safety-results.json ]; then
            total=$(jq '. | length' safety-results.json 2>/dev/null || echo "0")

            echo "### 📊 Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Total Vulnerabilities:** $total" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "$total" -gt 0 ]; then
              echo "vulnerabilities=$total" >> $GITHUB_OUTPUT
            else
              echo "vulnerabilities=0" >> $GITHUB_OUTPUT
            fi
          else
            echo "✅ No vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
            echo "vulnerabilities=0" >> $GITHUB_OUTPUT
          fi

      - name: Fail on vulnerabilities
        if: steps.parse_safety.outputs.vulnerabilities != '0'
        run: |
          echo "::error::Safety found ${{ steps.parse_safety.outputs.vulnerabilities }} known security vulnerabilities!"
          exit 1

      - name: Upload Safety results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-check-results
          path: safety-results.json
          retention-days: 30

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  security-dashboard-update:
    name: Update Security Dashboard
    needs: [trivy-scan, npm-audit, safety-check]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate dashboard summary
        run: |
          echo "## 📊 Dependency Security Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Critical | High | Medium | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|----------|------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy (SBOM) | ${{ needs.trivy-scan.outputs.critical || 'N/A' }} | ${{ needs.trivy-scan.outputs.high || 'N/A' }} | ${{ needs.trivy-scan.outputs.medium || 'N/A' }} | ${{ needs.trivy-scan.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm Audit | ${{ needs.npm-audit.outputs.critical || 'N/A' }} | ${{ needs.npm-audit.outputs.high || 'N/A' }} | ${{ needs.npm-audit.outputs.moderate || 'N/A' }} | ${{ needs.npm-audit.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Safety | N/A | N/A | ${{ needs.safety-check.outputs.vulnerabilities || '0' }} | ${{ needs.safety-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Last Updated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
