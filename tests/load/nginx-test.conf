events {
    worker_connections 1024;
}

http {
    upstream psychsync_backends {
        # Load balance across 3 backend instances
        # Using least_conn to distribute based on active connections
        least_conn;

        server backend-1:8001 max_fails=3 fail_timeout=30s;
        server backend-2:8002 max_fails=3 fail_timeout=30s;
        server backend-3:8003 max_fails=3 fail_timeout=30s;
    }

    # Rate limiting at nginx level (backup protection)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=health_limit:10m rate=50r/s;

    server {
        listen 80;
        server_name localhost;

        # Logging for debugging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Health check endpoint with per-IP rate limiting
        location /api/v1/health {
            limit_req zone=health_limit burst=10 nodelay;
            proxy_pass http://psychsync_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # All API endpoints
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://psychsync_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Health check for load balancer
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
