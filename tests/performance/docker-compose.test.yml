version: '3.8'

# Docker Compose for Isolated Load Testing Environment
# This setup creates a complete isolated environment for load testing

services:
  # PostgreSQL for testing
  test_db:
    image: postgres:15-alpine
    container_name: psychsync_test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: psychsync_test
    ports:
      - "5433:5432"
    volumes:
      - test_db_data:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - load_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for testing
  test_redis:
    image: redis:7-alpine
    container_name: psychsync_test_redis
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - load_test
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Locust master node
  locust_master:
    build:
      context: .
      dockerfile: Dockerfile.locust
    container_name: psychsync_locust_master
    command: locust -f /locust/locust/mixed_workload.py --master
    ports:
      - "8089:8089"
      - "5557:5557"
    volumes:
      - ./locust:/locust/locust
      - ./reports:/locust/reports
    networks:
      - load_test
    environment:
      - LOCUST_MODE=master
      - TARGET_HOST=http://psychsync_api:8000
    depends_on:
      - test_db
      - test_redis

  # Locust worker nodes
  locust_worker:
    build:
      context: .
      dockerfile: Dockerfile.locust
    command: locust -f /locust/locust/mixed_workload.py --worker --master-host=locust_master
    volumes:
      - ./locust:/locust/locust
    networks:
      - load_test
    environment:
      - LOCUST_MODE=worker
      - TARGET_HOST=http://psychsync_api:8000
    depends_on:
      - locust_master
    deploy:
      replicas: 5  # Number of worker nodes

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: psychsync_test_prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_test_data:/prometheus
    networks:
      - load_test
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: psychsync_test_grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=loadtest123
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana_test_data:/var/lib/grafana
    networks:
      - load_test
    depends_on:
      - prometheus

networks:
  load_test:
    driver: bridge

volumes:
  test_db_data:
  prometheus_test_data:
  grafana_test_data:
