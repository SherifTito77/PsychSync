# Advanced Monitoring & Observability Stack
# Enterprise-grade monitoring with Prometheus, Grafana, Jaeger, and Loki

version: '3.8'

services:
  # ===== PROMETHEUS - METRICS COLLECTION =====
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: psychsync-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=50GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--web.external-url=https://prometheus.psychsync.com'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
      - prometheus-data:/prometheus
    networks:
      - monitoring
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # ===== ALERTMANAGER - ALERT ROUTING =====
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: psychsync-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://alerts.psychsync.com'
      - '--cluster.listen-address=0.0.0.0:9093'
      - '--cluster.peer=alertmanager:9093'
    ports:
      - "9093:9093"
      - "9094:9094"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./alertmanager/templates:/etc/alertmanager/templates
      - alertmanager-data:/alertmanager
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== GRAFANA - VISUALIZATION =====
  grafana:
    image: grafana/grafana:10.0.0
    container_name: psychsync-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_DISABLE_GRAVATAR=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,grafana-worldmap-panel,grafana-piechart-panel,natel-discrete-panel,vonage-status-panel,grafana-geomap-panel
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - monitoring
      - backend
    restart: unless-stopped
    user: "472"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ===== JAEGER - DISTRIBUTED TRACING =====
  jaeger:
    image: jaegertracing/all-in-one:1.47
    container_name: psychsync-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # HTTP collector
      - "9411:9411"    # Zipkin compatible
    volumes:
      - jaeger-data:/tmp
    networks:
      - monitoring
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:14269/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== LOKI - LOG AGGREGATION =====
  loki:
    image: grafana/loki:2.8.0
    container_name: psychsync-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    networks:
      - monitoring
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== PROMTAIL - LOG COLLECTION =====
  promtail:
    image: grafana/promtail:2.8.0
    container_name: psychsync-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring
      - backend
    restart: unless-stopped
    depends_on:
      - loki

  # ===== NODE EXPORTER - SYSTEM METRICS =====
  node-exporter:
    image: prom/node-exporter:v1.6.0
    container_name: psychsync-node-exporter
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== CADVISOR - CONTAINER METRICS =====
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: psychsync-cadvisor
    command:
      - '--port=8080'
      - '--storage_duration=24h'
      - '--docker_only=true'
      - '--disable_metrics=accelerator,cpu_topology,disk,hugetlb,memory_numa,process,referenced_memory,resctrl,tcp,udp,percpu'
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - redis

  # ===== REDIS EXPORTER =====
  redis-exporter:
    image: oliver006/redis_exporter:v1.44.0
    container_name: psychsync-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_EXPORTER_LOG_FORMAT=txt
    ports:
      - "9121:9121"
    networks:
      - monitoring
      - backend
    restart: unless-stopped
    depends_on:
      - redis

  # ===== POSTGRES EXPORTER =====
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.11.1
    container_name: psychsync-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:password@postgres:5432/psychsync?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - monitoring
      - backend
    restart: unless-stopped
    depends_on:
      - postgres

  # ===== BLACKBOX EXPORTER - EXTERNAL PROBING =====
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.23.0
    container_name: psychsync-blackbox-exporter
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox/blackbox-config.yml:/etc/blackbox_exporter/config.yml
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    networks:
      - monitoring
      - backend
    restart: unless-stopped

  # ===== SPEEDTEST EXPORTER =====
  speedtest-exporter:
    image: miguelndecarvalho/speedtest-exporter:v3.5.3
    container_name: psychsync-speedtest-exporter
    environment:
      - SPEEDTEST_INTERVAL=3600  # Every hour
      - SPEEDTEST_SERVER_ID=0
    ports:
      - "9798:9798"
    networks:
      - monitoring
    restart: unless-stopped

  # ===== TELEPRESENCE FOR DEV MONITORING =====
  telepresence:
    image: datawire/telepresence-k8s:2.13.0
    container_name: psychsync-telepresence
    environment:
      - TELEPRESENCE_AGENT_PORT=8080
    ports:
      - "9091:9091"
    networks:
      - monitoring
      - backend
    profiles:
      - dev

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
  jaeger-data:
    driver: local
  loki-data:
    driver: local

networks:
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  backend:
    external: true