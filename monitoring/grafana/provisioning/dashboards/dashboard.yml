# Grafana Dashboard Provisioning Configuration
# Automatically loads dashboards from the configured directory
#
apiVersion: 1

providers:
  - name: 'PsychSync Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
