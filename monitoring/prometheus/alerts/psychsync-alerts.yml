# PsychSync Platform Alert Rules
# Comprehensive alerting for production monitoring

groups:
  - name: psychsync-app-alerts
    rules:
      # Application Health Alerts
      - alert: ApplicationDown
        expr: up{job="psychsync-app"} == 0
        for: 30s
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "PsychSync application is down"
          description: "PsychSync application on {{ $labels.instance }} has been down for more than 30 seconds."
          runbook_url: "https://docs.psychsync.com/runbooks/application-down"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.instance }} for more than 2 minutes."
          runbook_url: "https://docs.psychsync.com/runbooks/high-error-rate"

      - alert: VeryHighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.10
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Very high error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.instance }} for more than 1 minute."
          runbook_url: "https://docs.psychsync.com/runbooks/high-error-rate"

      # Performance Alerts
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}s on {{ $labels.instance }} for more than 5 minutes."
          runbook_url: "https://docs.psychsync.com/runbooks/high-response-time"

      - alert: VeryHighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Very high response time detected"
          description: "95th percentile response time is {{ $value }}s on {{ $labels.instance }} for more than 2 minutes."
          runbook_url: "https://docs.psychsync.com/runbooks/high-response-time"

      # Throughput Alerts
      - alert: LowRequestRate
        expr: rate(http_requests_total[5m]) < 10
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Low request rate detected"
          description: "Request rate is {{ $value }} requests/second on {{ $labels.instance }} for more than 10 minutes."
          runbook_url: "https://docs.psychsync.com/runbooks/low-request-rate"

      # Resource Usage Alerts
      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / 1024 / 1024) > 1000
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}MB on {{ $labels.instance }} for more than 5 minutes."
          runbook_url: "https://docs.psychsync.com/runbooks/high-memory-usage"

      - alert: VeryHighMemoryUsage
        expr: (process_resident_memory_bytes / 1024 / 1024) > 2000
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Very high memory usage detected"
          description: "Memory usage is {{ $value }}MB on {{ $labels.instance }} for more than 2 minutes."
          runbook_url: "https://docs.psychsync.com/runbooks/high-memory-usage"

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) * 100 > 80
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }} for more than 10 minutes."
          runbook_url: "https://docs.psychsync.com/runbooks/high-cpu-usage"

      - alert: VeryHighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) * 100 > 95
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Very high CPU usage detected"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }} for more than 5 minutes."
          runbook_url: "https://docs.psychsync.com/runbooks/high-cpu-usage"

  - name: psychsync-database-alerts
    rules:
      # Database Health Alerts
      - alert: PostgreSQLDown
        expr: up{job="postgresql"} == 0
        for: 30s
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "PostgreSQL database is down"
          description: "PostgreSQL database on {{ $labels.instance }} has been down for more than 30 seconds."
          runbook_url: "https://docs.psychsync.com/runbooks/database-down"

      - alert: HighDatabaseConnections
        expr: pg_stat_database_numbackends > 80
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High database connections"
          description: "Database has {{ $value }} active connections for more than 5 minutes."
          runbook_url: "https://docs.psychsync.com/runbooks/high-db-connections"

      - alert: VeryHighDatabaseConnections
        expr: pg_stat_database_numbackends > 90
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Very high database connections"
          description: "Database has {{ $value }} active connections for more than 2 minutes."
          runbook_url: "https://docs.psychsync.com/runbooks/high-db-connections"

      - alert: SlowDatabaseQueries
        expr: rate(pg_stat_statements_mean_time_seconds[5m]) > 1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Slow database queries detected"
          description: "Average query time is {{ $value }}s for more than 5 minutes."
          runbook_url: "https://docs.psychsync.com/runbooks/slow-queries"

      - alert: DatabaseSpaceUsage
        expr: (pg_database_size_bytes / 1073741824) > 50  # 50GB
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High database space usage"
          description: "Database size is {{ $value }}GB for more than 5 minutes."
          runbook_url: "https://docs.psychsync.com/runbooks/db-space-usage"

  - name: psychsync-cache-alerts
    rules:
      # Redis Cache Alerts
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 30s
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Redis cache is down"
          description: "Redis cache on {{ $labels.instance }} has been down for more than 30 seconds."
          runbook_url: "https://docs.psychsync.com/runbooks/redis-down"

      - alert: LowCacheHitRate
        expr: redis_cache_hit_rate < 70
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value }}% for more than 10 minutes."
          runbook_url: "https://docs.psychsync.com/runbooks/low-cache-hit-rate"

      - alert: HighRedisMemoryUsage
        expr: (redis_memory_used_bytes / redis_memory_max_bytes) * 100 > 80
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High Redis memory usage"
          description: "Redis memory usage is {{ $value }}% for more than 5 minutes."
          runbook_url: "https://docs.psychsync.com/runbooks/high-redis-memory"

  - name: psychsync-security-alerts
    rules:
      # Security Monitoring Alerts
      - alert: HighFailedLogins
        expr: rate(authentication_failures_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "High rate of failed logins"
          description: "Failed login rate is {{ $value }} attempts/second for more than 2 minutes."
          runbook_url: "https://docs.psychsync.com/runbooks/high-failed-logins"

      - alert: SuspiciousActivity
        expr: rate(suspicious_requests_total[5m]) > 5
        for: 1m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Suspicious activity detected"
          description: "Suspicious request rate is {{ $value }} requests/second for more than 1 minute."
          runbook_url: "https://docs.psychsync.com/runbooks/suspicious-activity"

      - alert: SSLCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 7  # 7 days
        for: 0s
        labels:
          severity: warning
          team: security
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.instance }} expires in less than 7 days."
          runbook_url: "https://docs.psychsync.com/runbooks/ssl-expiry"

      - alert: SSLCertificateExpired
        expr: probe_ssl_earliest_cert_expiry - time() < 0
        for: 0s
        labels:
          severity: critical
          team: security
        annotations:
          summary: "SSL certificate expired"
          description: "SSL certificate for {{ $labels.instance }} has expired."
          runbook_url: "https://docs.psychsync.com/runbooks/ssl-expired"

  - name: psychsync-business-alerts
    rules:
      # Business Metrics Alerts
      - alert: LowActiveUsers
        expr: active_users_total < 10
        for: 30m
        labels:
          severity: warning
          team: product
        annotations:
          summary: "Low number of active users"
          description: "Only {{ $value }} active users for more than 30 minutes."
          runbook_url: "https://docs.psychsync.com/runbooks/low-active-users"

      - alert: ZeroAssessmentsCompleted
        expr: increase(assessments_completed_total[1h]) == 0
        for: 2h
        labels:
          severity: warning
          team: product
        annotations:
          summary: "No assessments completed in 2 hours"
          description: "No assessments have been completed in the last 2 hours."
          runbook_url: "https://docs.psychsync.com/runbooks/no-assessments"

      - alert: HighAssessmentFailures
        expr: rate(assessment_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          team: product
        annotations:
          summary: "High assessment failure rate"
          description: "Assessment failure rate is {{ $value }} failures/second for more than 5 minutes."
          runbook_url: "https://docs.psychsync.com/runbooks/assessment-failures"

  - name: psychsync-infrastructure-alerts
    rules:
      # Infrastructure Alerts
      - alert: DiskSpaceUsage
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 20
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Low disk space"
          description: "Disk space is {{ $value }}% available on {{ $labels.instance }}."
          runbook_url: "https://docs.psychsync.com/runbooks/low-disk-space"

      - alert: VeryLowDiskSpace
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Very low disk space"
          description: "Disk space is {{ $value }}% available on {{ $labels.instance }}."
          runbook_url: "https://docs.psychsync.com/runbooks/very-low-disk-space"

      - alert: HighLoadAverage
        expr: node_load15 > 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High system load"
          description: "15-minute load average is {{ $value }} on {{ $labels.instance }}."
          runbook_url: "https://docs.psychsync.com/runbooks/high-load"