version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r requirements-prod.txt
run:
  command: "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
  network:
    port: 8000
    env: PAT
  env:
    - name: PORT
      value: "8000"
    - name: ENVIRONMENT
      value: "production"
    - name: DEBUG
      value: "false"
  secrets:
    - name: DATABASE_URL
    - name: REDIS_URL
    - name: SECRET_KEY
    - name: ENCRYPTION_KEY
    - name: ENCRYPTION_MASTER_KEY
    - name: SENTRY_DSN
