# Pre-commit hooks for PsychSync
# Install: pip install pre-commit
# Setup: pre-commit install
# Run: pre-commit run --all-files

repos:
  # Python linting with ruff
  - repo: local
    hooks:
      - id: ruff
        name: Ruff (Python Linter)
        entry: ruff check --force-exclude --fix
        language: system
        types: [python]
        exclude: ^(archived_services/|migrations/)

      - id: ruff-format
        name: Ruff (Python Formatter)
        entry: ruff format --force-exclude
        language: system
        types: [python]
        exclude: ^(archived_services/|migrations/)

  # TypeScript/JavaScript linting with eslint
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (TypeScript/JavaScript)
        entry: eslint --fix
        language: system
        files: ^(frontend/).*\.(ts|tsx|js|jsx)$

  # Documentation quality validation (Phase 1)
  - repo: local
    hooks:
      - id: documentation-quality
        name: Documentation Quality Check
        entry: python tests/documentation/run_doc_tests.py
        language: system
        files: ^(docs/).*\.md$
        pass_filenames: false
        # Only run on documentation files

  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(archived_services/)

      - id: end-of-file-fixer
        exclude: ^(archived_services/)

      - id: check-yaml
        exclude: ^(archived_services/)

      - id: check-json
        exclude: ^(archived_services/)

      - id: check-toml
        exclude: ^(archived_services/)

      - id: check-added-large-files
        args: ['--maxkb=1000']

      - id: check-merge-conflict
        exclude: ^(archived_services/)

      - id: check-case-conflict
        exclude: ^(archived_services/)

      - id: detect-private-key
        exclude: ^(archived_services/)

      - id: mixed-line-ending
        exclude: ^(archived_services/)

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] Auto-fix style issues

    This commit was automatically generated by pre-commit hooks.
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
