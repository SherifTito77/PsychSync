<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Assessment Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffe6e6; border: 1px solid #ff0000; }
        .success { background: #e6ffe6; border: 1px solid #00ff00; }
    </style>
</head>
<body>
    <h1>Wellness Assessment Debug Test</h1>
    <div id="debug-info"></div>

    <h2>Test Data Structure</h2>
    <div id="test-data"></div>

    <script>
        // Test the demo data structure
        const demoQuestions = [
            {
                id: 'physical',
                name: 'Physical Wellness',
                icon: '🏃',
                description: 'Physical health and lifestyle habits',
                weight: 1.0,
                questions: [
                    {
                        id: 'physical_1',
                        text: 'How would you rate your overall physical health?',
                        options: [
                            { value: 1, text: 'Poor' },
                            { value: 2, text: 'Fair' },
                            { value: 3, text: 'Good' },
                            { value: 4, text: 'Very Good' },
                            { value: 5, text: 'Excellent' }
                        ],
                        required: true
                    }
                ]
            }
        ];

        // Test data structure
        function testDataStructure() {
            const debugDiv = document.getElementById('debug-info');
            const testDiv = document.getElementById('test-data');

            try {
                // Test if we can access the data
                console.log('Testing wellness assessment data structure...');

                // Test domain structure
                const domain = demoQuestions[0];
                debugDiv.innerHTML += `<div class="debug success">✓ Domain has id: ${domain.id}, name: ${domain.name}</div>`;

                // Test question structure
                const question = domain.questions[0];
                debugDiv.innerHTML += `<div class="debug success">✓ Question has id: ${question.id}, text: ${question.text.substring(0, 30)}...</div>`;

                // Test options structure
                const options = question.options;
                debugDiv.innerHTML += `<div class="debug success">✓ Question has ${options.length} options</div>`;

                // Test option rendering
                testDiv.innerHTML = '<h3>Sample Question Options:</h3>';
                options.forEach(option => {
                    testDiv.innerHTML += `<div class="debug">Value: ${option.value}, Text: ${option.text}</div>`;
                });

                debugDiv.innerHTML += `<div class="debug success">✓ All tests passed! Data structure is correct.</div>`;

            } catch (error) {
                debugDiv.innerHTML += `<div class="debug error">✗ Error: ${error.message}</div>`;
            }
        }

        // Run tests when page loads
        window.addEventListener('load', testDataStructure);
    </script>
</body>
</html>
