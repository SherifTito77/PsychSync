apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: psychsync
  namespace: psychsync
  labels:
    app: psychsync
    component: backend
spec:
  replicas: 10  # Increased replicas for production

  # Blue-Green Deployment Strategy
  strategy:
    blueGreen:
      # Active service (current production)
      activeService: psychsvc-active
      # Preview service (new version)
      previewService: psychsvc-preview
      # Auto-promotion disabled for manual verification
      autoPromotionEnabled: false
      # Grace period before scaling down old version
      scaleDownDelaySeconds: 300
      # Pre-promotion analysis
      prePromotionAnalysis:
        templates:
        - templateName: success-rate
        - templateName: latency
        - templateName: error-rate
        args:
        - name: service-name
          value: psychsvc-preview
      # Post-promotion analysis
      postPromotionAnalysis:
        templates:
        - templateName: success-rate
        - templateName: latency
        args:
        - name: service-name
          value: psychsvc-active
      # Scale down old replicas immediately after successful promotion
      scaleDownDelaySeconds: 30

  # Pod template specification
  template:
    metadata:
      labels:
        app: psychsync
        component: backend
        version: v2.0  # Will be updated automatically
      annotations:
        # Prometheus monitoring
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        # Jaeger tracing
        sidecar.istio.io/inject: "true"
        # Application insights
        appmesh.k8s.aws/ports: "8000"
        appmesh.k8s.aws/tcp-timeout: "300"

    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 2000

      # Service account
      serviceAccountName: psychsync

      # Init containers
      initContainers:
      # Database migration check
      - name: migration-check
        image: postgres:15-alpine
        command: ['sh', '-c']
        args:
        - |
          echo "Checking database migrations..."
          until pg_isready -h $DB_HOST -p $DB_PORT -U $DB_USER; do
            echo "Waiting for database..."
            sleep 2
          done
          echo "Database is ready!"
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: psychsync-config
              key: database-host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: psychsync-config
              key: database-port
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: psychsync-secrets
              key: database-user
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "50m"

      # Redis connection check
      - name: redis-check
        image: redis:7-alpine
        command: ['sh', '-c']
        args:
        - |
          echo "Checking Redis connection..."
          until redis-cli -h $REDIS_HOST -p $REDIS_PORT ping; do
            echo "Waiting for Redis..."
            sleep 2
          done
          echo "Redis is ready!"
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: psychsync-config
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: psychsync-config
              key: redis-port
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "50m"

      # Main application container
      containers:
      - name: psychsync
        image: ghcr.io/sheriftito77/psychsync-backend:latest  # Update via CI/CD or kustomize overlay
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP

        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1

        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
          successThreshold: 1

        # Environment variables
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: psychsync-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: psychsync-secrets
              key: redis-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: psychsync-secrets
              key: secret-key
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: psychsync-secrets
              key: sentry-dsn
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: psychsync-secrets
              key: jwt-secret
        - name: STRIPE_API_KEY
          valueFrom:
            secretKeyRef:
              name: psychsync-secrets
              key: stripe-api-key

        # Resource limits and requests
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

        # Volume mounts
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: ssl-certs
          mountPath: /app/ssl
          readOnly: true
        - name: logs
          mountPath: /app/logs
        - name: temp
          mountPath: /tmp

        # Container lifecycle hooks
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]

      # Sidecar for log collection
      - name: fluentd
        image: fluent/fluentd:v1.16-debian-1
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
        volumeMounts:
        - name: logs
          mountPath: /app/logs
          readOnly: true
        - name: fluentd-config
          mountPath: /fluentd/etc
          readOnly: true

      # Sidecar for metrics collection
      - name: node-exporter
        image: prom/node-exporter:v1.7.0
        args:
        - "--path.procfs=/host/proc"
        - "--path.rootfs=/rootfs"
        - "--path.sysfs=/host/sys"
        - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)"
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "50m"
        volumeMounts:
        - name: proc
          mountPath: /host/proc
        - name: sys
          mountPath: /host/sys
        - name: root
          mountPath: /rootfs

      # Volumes
      volumes:
      - name: config
        configMap:
          name: psychsync-config
      - name: ssl-certs
        secret:
          secretName: psychsync-ssl-certs
          optional: true
      - name: logs
        emptyDir: {}
      - name: temp
        emptyDir: {}
      - name: fluentd-config
        configMap:
          name: fluentd-config
      - name: proc
        hostPath:
          path: /proc
          type: Directory
      - name: sys
        hostPath:
          path: /sys
          type: Directory
      - name: root
        hostPath:
          path: /
          type: Directory

      # Node selector and tolerations
      nodeSelector:
        node-type: application
        zone: primary

      tolerations:
      - key: "application"
        operator: "Exists"
        effect: "NoSchedule"

      # Pod affinity rules
      affinity:
        # Prefer nodes with existing psychsync pods
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - psychsync
              topologyKey: kubernetes.io/hostname

        # Anti-affinity for different applications
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: NotIn
                values:
                - database
                - redis
            topologyKey: kubernetes.io/hostname

        # Node affinity rules
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 80
            preference:
              matchExpressions:
              - key: instance-type
                operator: In
                values:
                - compute-optimized
                - memory-optimized

  # Update strategy
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 50%

  # Pod disruption budget
  minReadySeconds: 30

---
# Analysis Templates for Argo Rollouts
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
spec:
  args:
  - name: service-name
  metrics:
  - name: success-rate
    interval: 30s
    count: 5
    successCondition: result[0] >= 0.95
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          sum(rate(http_requests_total{service="{{args.service-name}}",status=~"2.."}[2m])) /
          sum(rate(http_requests_total{service="{{args.service-name}}"}[2m]))

---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: latency
spec:
  args:
  - name: service-name
  metrics:
  - name: latency
    interval: 30s
    count: 5
    successCondition: result[0] <= 0.5
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{service="{{args.service-name}}"}[2m])) by (le)
          )

---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-rate
spec:
  args:
  - name: service-name
  metrics:
  - name: error-rate
    interval: 30s
    count: 5
    successCondition: result[0] <= 0.05
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          sum(rate(http_requests_total{service="{{args.service-name}}",status=~"5.."}[2m])) /
          sum(rate(http_requests_total{service="{{args.service-name}}"}[2m]))
