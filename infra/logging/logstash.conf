# Logstash configuration for PsychSync
input {
  beats {
    port => 5044
  }

  # Direct TCP input for application logs
  tcp {
    port => 5000
    codec => json
  }

  # UDP input for structured logs
  udp {
    port => 5001
    codec => json
  }
}

filter {
  # Parse JSON logs from PsychSync application
  if [message] {
    json {
      source => "message"
      target => "parsed"
    }
  }

  # Add environment tag
  mutate {
    add_field => { "[@metadata][environment]" => "production" }
  }

  # Parse timestamp
  if [parsed][timestamp] {
    date {
      match => [ "[parsed][timestamp]", "ISO8601" ]
      target => "@timestamp"
    }
  }

  # Extract HTTP request information
  if [parsed][request] {
    grok {
      match => {
        "[parsed][request]" => "%{WORD:http_method} %{URIPATH:uri_path}(?:\?%{URIPARAM:uri_params})? HTTP/%{NUMBER:http_version}"
      }
    }
  }

  # Parse log levels
  if [parsed][level] {
    mutate {
      add_field => { "log_level" => "%{[parsed][level]}" }
    }
  }

  # Extract user information
  if [parsed][user_id] {
    mutate {
      add_field => { "user_id" => "%{[parsed][user_id]}" }
    }
  }

  # Extract team information
  if [parsed][team_id] {
    mutate {
      add_field => { "team_id" => "%{[parsed][team_id]}" }
    }
  }

  # Parse assessment events
  if [parsed][event_type] == "assessment" {
    mutate {
      add_tag => [ "assessment" ]
      add_field => { "assessment_id" => "%{[parsed][assessment_id]}" }
    }
  }

  # Parse team optimization events
  if [parsed][event_type] == "team_optimization" {
    mutate {
      add_tag => [ "team_optimization" ]
      add_field => { "optimization_score" => "%{[parsed][score]}" }
    }
  }

  # Parse authentication events
  if [parsed][event_type] == "auth" {
    mutate {
      add_tag => [ "authentication" ]
    }
  }

  # Parse error messages
  if [parsed][level] == "ERROR" or [parsed][level] == "CRITICAL" {
    mutate {
      add_tag => [ "error" ]
    }
  }

  # Extract response times
  if [parsed][response_time] {
    mutate {
      convert => { "[parsed][response_time]" => "float" }
      add_field => { "response_time_ms" => "%{[parsed][response_time]}" }
    }
  }

  # Extract status codes
  if [parsed][status_code] {
    mutate {
      convert => { "[parsed][status_code]" => "integer" }
      add_field => { "http_status" => "%{[parsed][status_code]}" }
    }
  }

  # Clean up fields
  mutate {
    remove_field => [ "message", "parsed" ]
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "psychsync-logs-%{+YYYY.MM.dd}"

    # Template for index patterns
    template_name => "psychsync"
    template_pattern => "psychsync-*"
    template => {
      "index_patterns" => ["psychsync-*"],
      "settings" => {
        "number_of_shards" => 1,
        "number_of_replicas" => 1
      },
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" },
          "log_level" => { "type" => "keyword" },
          "user_id" => { "type" => "keyword" },
          "team_id" => { "type" => "keyword" },
          "assessment_id" => { "type" => "keyword" },
          "http_status" => { "type" => "integer" },
          "response_time_ms" => { "type" => "float" },
          "http_method" => { "type" => "keyword" },
          "uri_path" => { "type" => "keyword" }
        }
      }
    }
  }

  # Debug output (remove in production)
  stdout {
    codec => rubydebug
  }
}
