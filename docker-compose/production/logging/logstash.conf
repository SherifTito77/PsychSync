# Logstash configuration for PsychSync log processing

input {
  # Parse application logs
  file {
    path => "/logs/app.log"
    start_position => "beginning"
    codec => json
    tags => ["application"]
  }

  # Parse Nginx access logs
  file {
    path => "/logs/nginx/access.log"
    start_position => "beginning"
    tags => ["nginx", "access"]
  }

  # Parse Nginx error logs
  file {
    path => "/logs/nginx/error.log"
    start_position => "beginning"
    tags => ["nginx", "error"]
  }

  # Parse database logs
  file {
    path => "/logs/postgresql.log"
    start_position => "beginning"
    tags => ["database"]
  }
}

filter {
  # Parse JSON application logs
  if "application" in [tags] {
    json {
      source => "message"
    }

    # Add environment and service metadata
    mutate {
      add_field => { "service" => "psychsync-backend" }
      add_field => { "environment" => "production" }
    }

    # Parse log levels
    if [level] == "ERROR" or [level] == "CRITICAL" {
      mutate { add_tag => ["alert"] }
    }
  }

  # Parse Nginx access logs
  if "nginx" in [tags] and "access" in [tags] {
    grok {
      match => {
        "message" => '%{COMBINEDAPACHELOG}+%{GREEDYDATA:extra_fields}'
      }
    }

    # Parse response time if available
    if [extra_fields] =~ /rt=/ {
      grok {
        match => {
          "extra_fields" => 'rt=%{NUMBER:response_time:float}'
        }
      }
    }

    # Convert response time to milliseconds
    if [response_time] {
      mutate {
        convert => { "response_time" => "float" }
      }
    }

    # Categorize HTTP status codes
    if [response] >= 500 {
      mutate { add_tag => ["server_error"] }
    } else if [response] >= 400 {
      mutate { add_tag => ["client_error"] }
    }

    mutate {
      add_field => { "service" => "nginx" }
      add_field => { "environment" => "production" }
    }
  }

  # Parse Nginx error logs
  if "nginx" in [tags] and "error" in [tags] {
    grok {
      match => {
        "message" => '%{TIMESTAMP_ISO8601:timestamp} \[%{LOGLEVEL:level}\] %{GREEDYDATA:error_message}'
      }
    }

    mutate {
      add_field => { "service" => "nginx" }
      add_field => { "environment" => "production" }
    }

    mutate { add_tag => ["alert"] }
  }

  # Parse database logs
  if "database" in [tags] {
    grok {
      match => {
        "message" => '%{TIMESTAMP_ISO8601:timestamp} \[%{DATA:pid}\] %{LOGLEVEL:level}: %{GREEDYDATA:db_message}'
      }
    }

    mutate {
      add_field => { "service" => "postgresql" }
      add_field => { "environment" => "production" }
    }

    # Alert on database errors
    if [level] == "ERROR" or [level] == "FATAL" {
      mutate { add_tag => ["alert"] }
    }
  }

  # Parse timestamps
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }

  # Add geoip for remote addresses
  if [clientip] {
    geoip {
      source => "clientip"
      target => "geoip"
    }
  }

  # Remove unnecessary fields
  mutate {
    remove_field => ["host", "path", "extra_fields"]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "psychsync-logs-%{+YYYY.MM.dd}"

    # Template for index patterns
    template_name => "psychsync"
    template => {
      "index_patterns" => ["psychsync-logs-*"],
      "settings" => {
        "number_of_shards" => 1,
        "number_of_replicas" => 1
      },
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" },
          "level" => { "type" => "keyword" },
          "service" => { "type" => "keyword" },
          "environment" => { "type" => "keyword" },
          "response" => { "type" => "integer" },
          "response_time" => { "type" => "float" },
          "clientip" => { "type" => "ip" },
          "geoip" => {
            "properties" => {
              "location" => { "type" => "geo_point" }
            }
          }
        }
      }
    }
  }

  # Debug output (remove in production)
  if [@metadata][debug] {
    stdout {
      codec => rubydebug
    }
  }
}