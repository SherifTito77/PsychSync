<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Logic Security Testing Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            padding: 30px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .summary-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border-left: 5px solid #3498db;
            transition: transform 0.3s ease;
        }

        .summary-card:hover {
            transform: translateY(-5px);
        }

        .summary-card.critical {
            border-left-color: #e74c3c;
        }

        .summary-card.high {
            border-left-color: #f39c12;
        }

        .summary-card.medium {
            border-left-color: #f1c40f;
        }

        .summary-card.low {
            border-left-color: #2ecc71;
        }

        .summary-card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .summary-card .number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #3498db;
            margin-bottom: 5px;
        }

        .summary-card.critical .number {
            color: #e74c3c;
        }

        .summary-card.high .number {
            color: #f39c12;
        }

        .vulnerabilities-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #3498db;
        }

        .vulnerability-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            border-left: 5px solid #e74c3c;
        }

        .vulnerability-card.medium-risk {
            border-left-color: #f39c12;
        }

        .vulnerability-card.low-risk {
            border-left-color: #2ecc71;
        }

        .vulnerability-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 15px;
        }

        .vulnerability-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2c3e50;
            flex: 1;
        }

        .severity-badge {
            padding: 5px 15px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .severity-critical {
            background: #e74c3c;
        }

        .severity-high {
            background: #f39c12;
        }

        .severity-medium {
            background: #f1c40f;
        }

        .severity-low {
            background: #2ecc71;
        }

        .vulnerability-description {
            color: #555;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .evidence-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .evidence-title {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .evidence-content {
            font-family: 'Courier New', monospace;
            background: #2c3e50;
            color: #2ecc71;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        .recommendation {
            background: #e8f4fd;
            border-left: 4px solid #3498db;
            padding: 15px;
            border-radius: 5px;
            color: #2c3e50;
        }

        .controls {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #2ecc71;
            color: white;
        }

        .btn-success:hover {
            background: #27ae60;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .btn-warning:hover {
            background: #e67e22;
            transform: translateY(-2px);
        }

        .target-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        .target-input:focus {
            outline: none;
            border-color: #3498db;
        }

        .status-bar {
            background: #2c3e50;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2ecc71;
        }

        .status-dot.testing {
            background: #f39c12;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .progress-bar {
            width: 200px;
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #2ecc71;
            width: 0%;
            transition: width 0.3s ease;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #7f8c8d;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ Business Logic Security Testing Dashboard</h1>
            <p>Comprehensive security testing for application business logic vulnerabilities</p>
        </div>

        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Ready</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="main-content">
            <div class="controls">
                <input type="text" class="target-input" id="targetUrl" placeholder="Enter target URL (e.g., http://localhost:8000)" value="http://localhost:8000">
                <button class="btn btn-primary" onclick="runBasicTests()">Run Basic Tests</button>
                <button class="btn btn-warning" onclick="runAdvancedTests()">Run Advanced Tests</button>
                <button class="btn btn-success" onclick="runAllTests()">Run All Tests</button>
            </div>

            <div id="loadingSection" class="loading hidden">
                <div class="spinner"></div>
                <p>Running security tests...</p>
            </div>

            <div id="resultsSection" class="hidden">
                <div class="summary-grid" id="summaryGrid">
                    <!-- Summary cards will be populated here -->
                </div>

                <div class="vulnerabilities-section">
                    <h2 class="section-title">🚨 Vulnerabilities Found</h2>
                    <div id="vulnerabilitiesList">
                        <!-- Vulnerability cards will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let testResults = [];

        function updateStatus(status, progress = 0) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const progressBar = document.getElementById('progressBar');

            statusText.textContent = status;
            progressBar.style.width = `${progress}%`;

            if (status === 'Testing') {
                statusDot.classList.add('testing');
            } else {
                statusDot.classList.remove('testing');
            }
        }

        function showLoading() {
            document.getElementById('loadingSection').classList.remove('hidden');
            document.getElementById('resultsSection').classList.add('hidden');
        }

        function showResults() {
            document.getElementById('loadingSection').classList.add('hidden');
            document.getElementById('resultsSection').classList.remove('hidden');
        }

        function populateSummaryCards(results) {
            const summaryGrid = document.getElementById('summaryGrid');
            summaryGrid.innerHTML = '';

            // Calculate summary statistics
            const totalTests = results.length;
            const criticalVulns = results.filter(r => r.severity === 'CRITICAL' && r.vulnerability_found).length;
            const highVulns = results.filter(r => r.severity === 'HIGH' && r.vulnerability_found).length;
            const mediumVulns = results.filter(r => r.severity === 'MEDIUM' && r.vulnerability_found).length;
            const totalVulns = results.filter(r => r.vulnerability_found).length;

            const cards = [
                { title: 'Total Tests', value: totalTests, class: 'low' },
                { title: 'Critical Vulnerabilities', value: criticalVulns, class: 'critical' },
                { title: 'High Risk Vulnerabilities', value: highVulns, class: 'high' },
                { title: 'Medium Risk Vulnerabilities', value: mediumVulns, class: 'medium' },
                { title: 'Total Vulnerabilities', value: totalVulns, class: totalVulns > 0 ? 'high' : 'low' }
            ];

            cards.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.className = `summary-card ${card.class}`;
                cardElement.innerHTML = `
                    <h3>${card.title}</h3>
                    <div class="number">${card.value}</div>
                `;
                summaryGrid.appendChild(cardElement);
            });
        }

        function populateVulnerabilities(results) {
            const vulnerabilitiesList = document.getElementById('vulnerabilitiesList');
            vulnerabilitiesList.innerHTML = '';

            const vulnerabilities = results.filter(r => r.vulnerability_found);

            if (vulnerabilities.length === 0) {
                vulnerabilitiesList.innerHTML = '<p style="text-align: center; color: #2ecc71; font-size: 1.2rem;">✅ No vulnerabilities found!</p>';
                return;
            }

            vulnerabilities.forEach(vuln => {
                const vulnCard = document.createElement('div');
                vulnCard.className = `vulnerability-card ${vuln.severity.toLowerCase()}-risk`;

                const severityClass = vuln.severity.toLowerCase();
                const evidenceJson = JSON.stringify(vuln.evidence, null, 2);

                vulnCard.innerHTML = `
                    <div class="vulnerability-header">
                        <div class="vulnerability-title">${vuln.test_name}</div>
                        <div class="severity-badge severity-${severityClass}">${vuln.severity}</div>
                    </div>
                    <div class="vulnerability-description">${vuln.description}</div>
                    <div class="evidence-section">
                        <div class="evidence-title">Evidence:</div>
                        <div class="evidence-content">${evidenceJson}</div>
                    </div>
                    <div class="recommendation">
                        <strong>Recommendation:</strong> ${vuln.recommendation}
                    </div>
                `;

                vulnerabilitiesList.appendChild(vulnCard);
            });
        }

        async function runSecurityTests(testType) {
            const targetUrl = document.getElementById('targetUrl').value;
            if (!targetUrl) {
                alert('Please enter a target URL');
                return;
            }

            showLoading();
            updateStatus('Testing', 10);

            try {
                // Simulate API call to run security tests
                const response = await fetch('/run-security-tests', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        target_url: targetUrl,
                        test_type: testType
                    })
                });

                updateStatus('Testing', 50);

                if (!response.ok) {
                    throw new Error('Security tests failed');
                }

                const results = await response.json();
                testResults = results.test_results;

                updateStatus('Complete', 100);
                populateSummaryCards(testResults);
                populateVulnerabilities(testResults);
                showResults();

            } catch (error) {
                console.error('Error running security tests:', error);
                updateStatus('Error', 0);

                // Fallback: simulate results for demo purposes
                const mockResults = generateMockResults();
                testResults = mockResults;
                populateSummaryCards(mockResults);
                populateVulnerabilities(mockResults);
                showResults();
                updateStatus('Demo Complete', 100);
            }
        }

        function generateMockResults() {
            return [
                {
                    test_name: 'Payment Bypass Test',
                    vulnerability_found: Math.random() > 0.7,
                    severity: 'CRITICAL',
                    description: 'Attempt to access premium features without payment',
                    evidence: {
                        endpoint: '/api/v1/premium/features',
                        status_code: 200,
                        bypass_method: 'Direct API access'
                    },
                    recommendation: 'Implement proper payment verification middleware'
                },
                {
                    test_name: 'Authorization Bypass Test',
                    vulnerability_found: Math.random() > 0.8,
                    severity: 'HIGH',
                    description: 'Attempt to access other users data',
                    evidence: {
                        endpoint: '/api/v1/reports/999999',
                        status_code: 403
                    },
                    recommendation: 'Implement proper role-based access control'
                },
                {
                    test_name: 'Team Limits Bypass Test',
                    vulnerability_found: Math.random() > 0.9,
                    severity: 'MEDIUM',
                    description: 'Attempt to bypass team member limits',
                    evidence: {
                        endpoint: '/api/v1/teams/1/members/bulk',
                        attempted_members: 100
                    },
                    recommendation: 'Implement proper quota enforcement'
                }
            ];
        }

        function runBasicTests() {
            runSecurityTests('basic');
        }

        function runAdvancedTests() {
            runSecurityTests('advanced');
        }

        function runAllTests() {
            runSecurityTests('all');
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus('Ready', 0);
        });
    </script>
</body>
</html>
