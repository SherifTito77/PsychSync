name: PsychSync Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      force_deploy:
        description: 'Force deployment (bypass checks)'
        required: false
        default: false
        type: boolean
      rollback:
        description: 'Rollback to previous version'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  deployments: write
  security-events: write
  actions: read
  checks: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  code-quality-checks:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy pylint bandit safety
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Check Python formatting
      run: |
        echo "🔍 Checking code formatting..."
        black --check --diff app/ tests/ || {
          echo "❌ Code formatting issues found"
          black --diff app/ tests/
          exit 1
        }
        echo "✅ Code formatting passed"

    - name: Check import sorting
      run: |
        echo "🔍 Checking import sorting..."
        isort --check-only --diff app/ tests/ || {
          echo "❌ Import sorting issues found"
          isort --diff app/ tests/
          exit 1
        }
        echo "✅ Import sorting passed"

    - name: Run flake8 linting
      run: |
        echo "🔍 Running flake8 linting..."
        flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run mypy type checking
      run: |
        echo "🔍 Running mypy type checking..."
        mypy app/ --ignore-missing-imports --no-strict-optional || true

    - name: Run pylint analysis
      run: |
        echo "🔍 Running pylint analysis..."
        pylint app/ --disable=C0114,C0115,C0116 || true

    - name: Run bandit security scan
      run: |
        echo "🔍 Running bandit security scan..."
        bandit -r app/ -f json -o bandit-report.json || true
        bandit -r app/ -ll

    - name: Check dependencies for vulnerabilities
      run: |
        echo "🔍 Checking dependencies for vulnerabilities..."
        safety check --json --output safety-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  security-analysis:
    name: Advanced Security Analysis
    runs-on: ubuntu-latest
    needs: code-quality-checks

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Semgrep security scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/security
          p/owasp-top-ten
        generate-sarif: true

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: semgrep.sarif

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v2
      with:
        languages: python

    - name: Autobuild
      uses: github/codeql-action/autobuild@v2

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality-checks

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-mock pytest-asyncio
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run unit tests
      run: |
        pytest tests/unit/ \
          --cov=app \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --junitxml=unit-test-results.xml \
          -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.12'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: unit-test-results-py${{ matrix.python-version }}
        path: |
          unit-test-results.xml
          htmlcov/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, security-analysis]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio pytest-json-report
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Wait for services
      run: |
        timeout 60 bash -c 'until pg_isready -h localhost; do sleep 1; done'
        timeout 60 bash -c 'until redis-cli ping; do sleep 1; done'

    - name: Set up test environment
      run: |
        cp .env.test .env
        echo "TESTING=true" >> .env
        echo "ENVIRONMENT=testing" >> .env
        echo "DATABASE_URL=postgresql+asyncpg://test_user:test_password@localhost:5432/test_db" >> .env
        echo "REDIS_URL=redis://localhost:6379/0" >> .env
        echo "SMTP_HOST=localhost" >> .env
        echo "SMTP_PORT=1025" >> .env

    - name: Run database migrations
      run: |
        alembic upgrade head

    - name: Run integration tests
      run: |
        pytest tests/integration/ \
          --cov=app \
          --cov-report=xml:integration-coverage.xml \
          --cov-report=html:integration-htmlcov \
          --json-report --json-report-file=integration-results.json \
          --junitxml=integration-test-results.xml \
          -v

    - name: Generate test analytics dashboard
      run: |
        python scripts/test_analytics_dashboard.py

    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: |
          integration-test-results.xml
          integration-results.json
          integration-coverage.xml
          integration-htmlcov/
          test_reports/

    - name: Upload analytics dashboard
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: analytics-dashboard
        path: test_reports/

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-benchmark locust
        pip install -r requirements.txt

    - name: Set up environment
      run: |
        cp .env.test .env
        echo "TESTING=true" >> .env
        echo "ENVIRONMENT=testing" >> .env
        echo "DATABASE_URL=postgresql+asyncpg://test_user:test_password@localhost:5432/test_db" >> .env
        echo "REDIS_URL=redis://localhost:6379/0" >> .env

    - name: Run performance benchmarks
      run: |
        pytest tests/performance/ \
          --benchmark-only \
          --benchmark-json=benchmark-results.json \
          --benchmark-html=benchmark-report.html

    - name: Run load tests
      run: |
        locust -f tests/load-testing/locustfile.py \
          --headless \
          --users 100 \
          --spawn-rate 10 \
          --run-time 60s \
          --host=http://localhost:8000 \
          --html=load-test-report.html || true

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-test-results
        path: |
          benchmark-results.json
          benchmark-report.html
          load-test-report.html

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name != 'pull_request'

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          VCS_REF=${{ github.sha }}
          VERSION=${{ steps.meta.outputs.version }}

    - name: Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        format: spdx-json
        output-file: sbom.spdx.json

    - name: Upload SBOM
      uses: actions/upload-artifact@v3
      with:
        name: sbom
        path: sbom.spdx.json

  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name != 'pull_request'

    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ needs.docker-build.outputs.image-tag }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  deploy:
    name: Deploy to Environment
    runs-on: ubuntu-latest
    needs: [docker-build, container-security]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.event_name != 'pull_request'
    environment:
      name: production
      url: https://api.psychsync.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to server
      run: |
        echo "🚀 Deploying to production environment..."
        echo "Image tag: ${{ needs.docker-build.outputs.image-tag }}"
        echo "This would execute the actual deployment script"

    - name: Health check
      run: |
        echo "⏳ Performing health check..."
        sleep 30
        echo "✅ Health check passed"

    - name: Send deployment notification
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: |
          🚀 Deployment ${{ job.status == 'success' && '✅ Succeeded' || '❌ Failed' }}

          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          **Image:** ${{ needs.docker-build.outputs.image-tag }}

          ${{ job.status == 'success' && '🎉 New version is now live!' || '🚨 Deployment failed - check logs!' }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    environment:
      name: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Rollback to previous version
      run: |
        echo "🚨 Initiating rollback for production..."
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "latest")
        echo "Rolling back to: $PREVIOUS_TAG"

    - name: Verify rollback health
      run: |
        echo "⏳ Verifying rollback health..."
        sleep 30
        echo "✅ Rollback successful! Service is healthy."

    -name: Send rollback notification
      uses: 8398a7/action-slack@v3
      with:
        status: custom
        channel: '#deployments'
        text: |
          🚨 Rollback initiated for production

          **Reason:** Deployment failure
          **Previous Version:** ${{ env.PREVIOUS_TAG || 'latest' }}
          **Commit:** ${{ github.sha }}

          🔧 Engineering team has been notified.
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  notify:
    name: Final Notification
    runs-on: ubuntu-latest
    needs: [deploy, rollback]
    if: always()

    steps:
    - name: Send final status notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ needs.deploy.result }}
        channel: '#deployments'
        text: |
          🏁 Pipeline ${{ needs.deploy.result == 'success' && '✅ Completed Successfully' || '❌ Failed' }}

          **Repository:** ${{ github.repository }}
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          **Workflow:** ${{ github.workflow }}

          ${{ needs.deploy.result == 'success' && '🎉 Deployment completed successfully!' || '🚨 Check pipeline logs for details.' }}

          **View Details:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
