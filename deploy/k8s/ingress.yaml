apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: psychsync-ingress
  namespace: psychsync
  annotations:
    # Ingress controller
    kubernetes.io/ingress.class: "nginx"

    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"

    # Connection timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"

    # Large request support for file uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

    # WebSocket support (longer timeouts for real-time connections)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    # CORS configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com; frame-src 'self' https://js.stripe.com" always;

    # Compression
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-modsecurity-crs: "true"

    # SSL/TLS configuration
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Custom error pages
    nginx.ingress.kubernetes.io/custom-http-errors: "404,503"

    # Connection management
    nginx.ingress.kubernetes.io/limit-connections: "100"
    nginx.ingress.kubernetes.io/limit-rps: "200"

    # Health checks
    nginx.ingress.kubernetes.io/healthcheck-path: "/health"
    nginx.ingress.kubernetes.io/healthcheck-interval: "30s"

    # Session affinity for sticky sessions
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "psychsync-affinity"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"

spec:
  # TLS termination
  tls:
  - hosts:
    - app.psychsync.com
    - api.psychsync.com
    secretName: psychsync-tls

  # Main application
  rules:
  - host: app.psychsync.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: psychsvc-frontend
            port:
              number: 80

  - host: api.psychsync.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: psychsvc-backend
            port:
              number: 8000
      # Health and metrics endpoints
      - path: /health
        pathType: Exact
        backend:
          service:
            name: psychsvc-backend
            port:
              number: 8000
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: psychsvc-backend
            port:
              number: 8000
