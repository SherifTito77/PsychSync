---
# Workflow: Deploy to Production via ArgoCD

# Step 1: Developer commits to main branch
# $ git commit -m "feat: new feature"
# $ git push origin main

# Step 2: CI builds and tests (GitHub Actions)
# .github/workflows/build-and-deploy.yaml:
# name: Build and Deploy
# on:
#   push:
#     branches: [main]
# jobs:
#   build:
#     runs-on: ubuntu-latest
#     steps:
#     - uses: actions/checkout@v3
#     - name: Build Docker image
#       run: |
#         docker build -t psychsync/backend:${{ github.sha }} .
#     - name: Push to registry
#       run: |
#         docker tag psychsync/backend:${{ github.sha }} psychsync/backend:v1.0.0
#         docker push psychsync/backend:v1.0.0
#     - name: Update GitOps repo
#       run: |
#         git clone https://github.com/psychsync/psychsync-gitops.git
#         cd psychsync-gitops
#         # Update image tag in overlay
#         yq eval '.images[0].newTag = "v1.0.0"' -i apps/psychsync-backend/overlays/production/kustomization.yaml
#         git commit -am "Update image to v1.0.0"
#         git push

# Step 3: ArgoCD detects change and syncs
# - ArgoCD polls git repo every 3 minutes
# - Detects new commit with updated image tag
# - Triggers sync automatically (auto-sync enabled)

# Step 4: Pre-sync hooks run
# - DB migration job runs
# - Waits for completion

# Step 5: ArgoCD syncs application
# - Creates new ReplicaSet with new image
# - Performs rolling update
# - Waits for health checks

# Step 6: Post-sync hooks run
# - Smoke tests run
# - If successful, marks sync as succeeded
# - If failed, rolls back automatically

# Step 7: Notifications sent
# - Slack notification sent
# - Prometheus metrics updated
# - Incident created on failure

---
# Example GitHub Actions workflow for GitOps
name: Build and Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: psychsync/backend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Run tests
      run: |
        docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG pytest

    - name: Update GitOps repository
      env:
        GITOPS_REPO: https://github.com/psychsync/psychsync-gitops.git
        GIT_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      run: |
        # Clone GitOps repo
        git clone https://x-access-token:${GIT_TOKEN}@github.com/psychsync/psychsync-gitops.git
        cd psychsync-gitops

        # Update image tag using yq
        yq eval '.images[0].newTag = "${{ github.sha }}"' -i apps/psychsync-backend/overlays/production/kustomization.yaml

        # Commit and push
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git commit -am "Update psychsync-backend image to ${{ github.sha }}"
        git push

    - name: Notify ArgoCD to sync (optional - auto-sync enabled)
      env:
        ARGOCD_SERVER: argocd.psychsync.com
        ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
      run: |
        # Trigger sync (if not using auto-sync)
        argocd app sync psychsync-backend-production --auth-token $ARGOCD_AUTH_TOKEN --server $ARGOCD_SERVER

---
################################################################################
# End of ArgoCD GitOps Configuration
################################################################################

# Usage:
#
# 1. Install ArgoCD:
#    helm install argocd argo-cd/argo-cd -f values.yaml -n argocd --create-namespace
#
# 2. Create projects:
#    kubectl apply -f project-psychsync-production.yaml
#
# 3. Create applications:
#    kubectl apply -f application-psychsync-backend.yaml
#
# 4. Enable auto-sync:
#    ArgoCD will automatically sync when git changes
#
# 5. Monitor deployments:
#    argocd app list
#    argocd app get psychsync-backend-production
#    argocd app logs psychsync-backend-production
#
# 6. Rollback if needed:
#    argocd app rollback psychsync-backend-production
#
# 7. Monitor sync status:
#    kubectl get applications -n argocd
#    argocd app watch psychsync-backend-production
