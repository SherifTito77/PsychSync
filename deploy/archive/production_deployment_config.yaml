# Production Deployment Configuration
# This file contains deployment settings for production environments

# Global deployment settings
global:
  environment: "production"
  zero_downtime: true
  backup_before_deploy: true
  rollback_threshold: 5.0
  default_timeout: 600.0

# Application configurations
applications:
  psychsync-api:
    name: "psychsync-api"
    repository: "psychsync/api"
    port: 8000
    replicas: 3

    # Blue-Green deployment configuration
    blue_green:
      enabled: true
      health_check_timeout: 120
      warmup_time: 30
      switch_delay: 10

    # Canary deployment configuration
    canary:
      enabled: true
      initial_percentage: 10.0
      increment_percentage: 10.0
      max_percentage: 50.0
      verification_time: 300

    # Health checks
    health_checks:
      - name: "Basic Health"
        endpoint: "/api/v1/health"
        method: "GET"
        expected_status: 200
        timeout: 30.0
        retries: 3
        retry_delay: 10.0

      - name: "Database Health"
        endpoint: "/api/v1/health/database"
        method: "GET"
        expected_status: 200
        timeout: 30.0
        retries: 3
        retry_delay: 10.0

      - name: "API Performance Check"
        endpoint: "/api/v1/users/me"
        method: "GET"
        expected_status: 200
        timeout: 15.0
        retries: 2
        retry_delay: 5.0
        headers:
          "Authorization": "Bearer $TEST_TOKEN"

# Environment-specific configurations
environments:
  production:
    database:
      migrate: true
      backup_required: true
      connection_timeout: 30.0

    monitoring:
      enabled: true
      metrics_endpoint: "/metrics"
      health_endpoint: "/health"

    security:
      ssl_required: true
      secret_validation: true
      rate_limiting_enabled: true

    notifications:
      slack_webhook: "$SLACK_WEBHOOK_URL"
      email_alerts: ["devops@psychsync.com"]

  staging:
    database:
      migrate: true
      backup_required: false
      connection_timeout: 15.0

    monitoring:
      enabled: true
      metrics_endpoint: "/metrics"

    security:
      ssl_required: false
      secret_validation: false

    notifications:
      slack_webhook: "$SLACK_STAGING_WEBHOOK"

# Rollback policies
rollback_policies:
  automatic:
    enabled: true
    triggers:
      error_rate_threshold: 10.0
      response_time_threshold: 5.0
      health_check_failures: 3
      deployment_timeout: 600.0

    cooldown_period: 300  # Seconds before allowing re-deployment

  manual:
    approval_required: true
    approvers: ["devops-team@psychsync.com"]
    approval_window: 3600  # 1 hour

# Notification templates
notifications:
  deployment_started:
    title: "🚀 Deployment Started: {app_name} v{version}"
    message: |
      Deployment {deployment_id} has started for {app_name} version {version}.
      Strategy: {strategy}
      Environment: {environment}

      Started at: {start_time}

  deployment_completed:
    title: "✅ Deployment Completed: {app_name} v{version}"
    message: |
      Deployment {deployment_id} completed successfully!

      Duration: {duration} seconds
      Health checks: {health_status}
      Response time: {response_time}ms

  deployment_failed:
    title: "❌ Deployment Failed: {app_name} v{version}"
    message: |
      Deployment {deployment_id} failed.

      Error: {error}
      Duration: {duration} seconds
      Rollback: {rollback_status}

  rollback_initiated:
    title: "🔄 Rollback Initiated: {app_name}"
    message: |
      Automatic rollback initiated for deployment {deployment_id}.

      Reason: {rollback_reason}
      Target version: {target_version}
