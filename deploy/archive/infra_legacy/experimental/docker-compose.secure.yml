version: "3.9"

# Secure Docker Compose Configuration for PsychSync
# Addresses network security vulnerabilities by isolating services
# and removing unnecessary port exposures

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.secure
    container_name: psychsync-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --ssl-keyfile=/app/certs/psychsync.key --ssl-certfile=/app/certs/psychsync.crt
    volumes:
      - ./app:/app/app
      - ./certs:/app/certs:ro  # Read-only certificates
    env_file:
      - .env.secure
    # NO EXPOSED PORTS - Internal only
    depends_on:
      - db
      - redis
    networks:
      - psychsync-internal-network
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - SSL_ENABLED=true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true  # Read-only filesystem
    tmpfs:
      - /tmp
      - /var/tmp
    healthcheck:
      test: ["CMD", "curl", "-k", "https://localhost:8000/api/v1/health/public"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15-alpine
    container_name: psychsync-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # NO EXPOSED PORTS - Database only accessible internally
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:latest/docker-entrypoint-initdb.d:ro
    networks:
      - psychsync-internal-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Configure PostgreSQL to accept connections only from backend
    command: >
      postgres
      -c listen_addresses='*'
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

  redis:
    image: redis:7-alpine
    container_name: psychsync-redis
    restart: always
    # NO EXPOSED PORTS - Redis only accessible internally
    volumes:
      - redisdata:/data
    networks:
      - psychsync-internal-network
    security_opt:
      - no-new-privileges:true
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: psychsync-nginx
    ports:
      # ONLY expose HTTPS port 443 to the world
      - "443:443"
      - "80:80"  # For SSL certificate renewal (redirects to HTTPS)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl.conf:/etc/nginx/ssl.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:latest/var/log/nginx
    networks:
      - psychsync-internal-network
      - psychsync-frontend-network
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.secure
    container_name: psychsync-frontend
    volumes:
      - ./frontend/dist:latest/usr/share/nginx/html:ro
    networks:
      - psychsync-frontend-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  # Internal network for application services
  psychsync-internal-network:
    driver: bridge
    internal: true  # No external internet access
    ipam:
      config:
        - subnet: 172.20.0.0/16

  # Frontend network with limited external access
  psychsync-frontend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
