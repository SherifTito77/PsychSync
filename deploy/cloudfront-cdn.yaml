# ==========================================
# AWS CloudFront CDN Configuration
# ==========================================

Resources:
  # CloudFront Distribution for PsychSync
  PsychSyncCDNDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        # Basic Configuration
        Comment: "PsychSync Production CDN"
        DefaultRootObject: "index.html"
        Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100  # US, Canada, Europe

        # Custom Domain and SSL
        Aliases:
          - "cdn.psychsync.com"
          - "app-cdn.psychsync.com"
          - "api-cdn.psychsync.com"

        ViewerCertificate:
          AcmCertificateArn: "arn:aws:acm:us-east-1:123456789012:certificate/12345678-1234-1234-1234-123456789012"
          SslSupportMethod: "sni-only"
          MinimumProtocolVersion: "TLSv1.2_2021"

        # Default Cache Behavior
        DefaultCacheBehavior:
          TargetOriginId: "S3-PsychSync-Origin"
          ViewerProtocolPolicy: "redirect-to-https"
          AllowedMethods:
            - "GET"
            - "HEAD"
            - "OPTIONS"
          CachedMethods:
            - "GET"
            - "HEAD"
            - "OPTIONS"
          Compress: true
          CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"  # Managed-CachingOptimized
          OriginRequestPolicyId: "88a5eaf4-2fd4-4709-b370-b4c650ea3fcf"  # Managed-CORS-S3Origin

        # Cache Behaviors for different content types
        CacheBehaviors:
          # API endpoints - no caching
          - PathPattern: "/api/*"
            TargetOriginId: "API-PsychSync-Origin"
            ViewerProtocolPolicy: "https-only"
            AllowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "OPTIONS"
              - "HEAD"
              - "PATCH"
            CachedMethods:
              - "GET"
              - "HEAD"
              - "OPTIONS"
            CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"  # Managed-CachingDisabled
            OriginRequestPolicyId: "b68977e0-97cb-11ea-b2de-0a7eb6023a53"  # Managed-AllViewer

          # Static assets - long caching
          - PathPattern: "/assets/*"
            TargetOriginId: "S3-PsychSync-Origin"
            ViewerProtocolPolicy: "https-only"
            AllowedMethods:
              - "GET"
              - "HEAD"
              - "OPTIONS"
            CachedMethods:
              - "GET"
              - "HEAD"
              - "OPTIONS"
            Compress: true
            CachePolicyId: "b2884449-e231-44a1-b98d-09d4c281a2ea"  # Managed-CachingOptimized
            MinTTL: 31536000  # 1 year
            MaxTTL: 31536000  # 1 year

          # Images - optimized caching
          - PathPattern: "/images/*"
            TargetOriginId: "S3-PsychSync-Origin"
            ViewerProtocolPolicy: "https-only"
            AllowedMethods:
              - "GET"
              - "HEAD"
              - "OPTIONS"
            CachedMethods:
              - "GET"
              - "HEAD"
              - "OPTIONS"
            Compress: true
            CachePolicyId: "b2884449-e231-44a1-b98d-09d4c281a2ea"  # Managed-CachingOptimized
            MinTTL: 2592000   # 30 days
            MaxTTL: 2592000   # 30 days

          # Fonts - very long caching
          - PathPattern: "/fonts/*"
            TargetOriginId: "S3-PsychSync-Origin"
            ViewerProtocolPolicy: "https-only"
            AllowedMethods:
              - "GET"
              - "HEAD"
              - "OPTIONS"
            CachedMethods:
              - "GET"
              - "HEAD"
              - "OPTIONS"
            CachePolicyId: "b2884449-e231-44a1-b98d-09d4c281a2ea"  # Managed-CachingOptimized
            MinTTL: 31536000  # 1 year
            MaxTTL: 31536000  # 1 year

        # Origins
        Origins:
          # S3 Origin for static assets
          - Id: "S3-PsychSync-Origin"
            DomainName: "psychsync-production.s3.amazonaws.com"
            S3OriginConfig:
              OriginAccessIdentity: "origin-access-identity/cloudfront/E1234567890ABCDEF"

          # API Origin
          - Id: "API-PsychSync-Origin"
            DomainName: "api.psychsync.com"
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: "https-only"
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5

        # Geo Restrictions
        Restrictions:
          GeoRestriction:
            RestrictionType: "none"

        # Logging
        Logging:
          Bucket: "psychsync-cdn-logs.s3.amazonaws.com"
          IncludeCookies: false
          Prefix: "cloudfront-logs/"

        # Error Pages
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: "/error/403.html"
            ResponseCode: "403"
            ErrorCachingMinTTL: 300
          - ErrorCode: 404
            ResponsePagePath: "/error/404.html"
            ResponseCode: "404"
            ErrorCachingMinTTL: 300
          - ErrorCode: 500
            ResponsePagePath: "/error/500.html"
            ResponseCode: "500"
            ErrorCachingMinTTL: 60

        # WAF Association
        WebACLId: "arn:aws:wafv2:us-east-1:123456789012:global/webacl/psychsync-waf/12345678-1234-1234-1234-123456789012"

  # S3 Bucket for static assets
  PsychSyncS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: "psychsync-production"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: "AES256"
      LifecycleConfiguration:
        Rules:
          - Id: "DeleteOldVersions"
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
          - Id: "TransitionToIA"
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: "STANDARD_IA"
              - TransitionInDays: 90
                StorageClass: "GLACIER"
              - TransitionInDays: 365
                StorageClass: "DEEP_ARCHIVE"

  # CloudFront Origin Access Identity
  PsychSyncOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: "OAI for PsychSync S3 bucket"

  # S3 Bucket Policy for CloudFront
  PsychSyncS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PsychSyncS3Bucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::cloudfront:user/Origin Access Identity ${PsychSyncOriginAccessIdentity}"
            Action: "s3:GetObject"
            Resource: !Sub "${PsychSyncS3Bucket}/*"

  # WAF Web ACL
  PsychSyncWAF:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: "psychsync-waf"
      Scope: "CLOUDFRONT"
      DefaultAction:
        Allow: {}
      Rules:
        # Rate limiting
        - Name: "RateLimitRule"
          Priority: 1
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: "IP"
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: "RateLimitRule"

        # SQL Injection protection
        - Name: "SQLInjectionRule"
          Priority: 2
          Statement:
            SqliMatchStatement:
              FieldToMatch:
                Body: {}
                QueryString: {}
                Cookies:
                  MatchPattern:
                    IncludedCookies: []
                  MatchScope: "ALL"
              TextTransformations:
                - Priority: 0
                  Type: "URL_DECODE"
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: "SQLInjectionRule"

        # XSS protection
        - Name: "XSSRule"
          Priority: 3
          Statement:
            XssMatchStatement:
              FieldToMatch:
                Body: {}
              TextTransformations:
                - Priority: 0
                  Type: "URL_DECODE"
                - Priority: 1
                  Type: "HTML_ENTITY_DECODE"
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: "XSSRule"

        # Geographic blocking (optional)
        - Name: "GeoBlockRule"
          Priority: 4
          Statement:
            NotStatement:
              Statement:
                GeoMatchStatement:
                  CountryCodes:
                    - "US"
                    - "CA"
                    - "GB"
                    - "DE"
                    - "FR"
                    - "AU"
                    - "JP"
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: "GeoBlockRule"
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: "PsychSyncWAF"

  # Route 53 Records
  PsychSyncDNSRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneName: "psychsync.com."
      Comment: "DNS records for PsychSync CDN"
      RecordSets:
        # CDN distribution record
        - Name: "cdn.psychsync.com."
          Type: "A"
          AliasTarget:
            HostedZoneId: "Z2FDTNDATAQYW2"  # CloudFront hosted zone ID
            DNSName: !GetAtt PsychSyncCDNDistribution.DomainName
            EvaluateTargetHealth: false

        # App CDN record
        - Name: "app-cdn.psychsync.com."
          Type: "A"
          AliasTarget:
            HostedZoneId: "Z2FDTNDATAQYW2"  # CloudFront hosted zone ID
            DNSName: !GetAtt PsychSyncCDNDistribution.DomainName
            EvaluateTargetHealth: false

        # API CDN record
        - Name: "api-cdn.psychsync.com."
          Type: "A"
          AliasTarget:
            HostedZoneId: "Z2FDTNDATAQYW2"  # CloudFront hosted zone ID
            DNSName: !GetAtt PsychSyncCDNDistribution.DomainName
            EvaluateTargetHealth: false

  # CloudWatch Alarms for CDN
  CDNHighErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "PsychSync-CDN-High-Error-Rate"
      AlarmDescription: "High error rate in CloudFront CDN"
      MetricName: "5xxErrorRate"
      Namespace: "AWS/CloudFront"
      Statistic: "Average"
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: "GreaterThanThreshold"
      TreatMissingData: "notBreaching"
      AlarmActions:
        - "arn:aws:sns:us-east-1:123456789012:psychsync-alerts"

  CDNHighLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "PsychSync-CDN-High-Latency"
      AlarmDescription: "High latency in CloudFront CDN"
      MetricName: "TotalTime"
      Namespace: "AWS/CloudFront"
      Statistic: "Average"
      Period: 300
      EvaluationPeriods: 4
      Threshold: 1000
      ComparisonOperator: "GreaterThanThreshold"
      TreatMissingData: "notBreaching"
      AlarmActions:
        - "arn:aws:sns:us-east-1:123456789012:psychsync-alerts"

  # Lambda@Edge for dynamic content
  EdgeLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "psychsync-edge-processor"
      Runtime: "nodejs18.x"
      Handler: "index.handler"
      Role: "arn:aws:iam::123456789012:role/edge-lambda-role"
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            const request = event.Records[0].cf.request;
            const headers = request.headers;

            // Add security headers
            headers['strict-transport-security'] = [{
              key: 'Strict-Transport-Security',
              value: 'max-age=31536000; includeSubDomains; preload'
            }];

            headers['x-content-type-options'] = [{
              key: 'X-Content-Type-Options',
              value: 'nosniff'
            }];

            headers['x-frame-options'] = [{
              key: 'X-Frame-Options',
              value: 'SAMEORIGIN'
            }];

            headers['x-xss-protection'] = [{
              key: 'X-XSS-Protection',
              value: '1; mode=block'
            }];

            // Add CORS headers for API
            if (request.uri.startsWith('/api/')) {
              headers['access-control-allow-origin'] = [{
                key: 'Access-Control-Allow-Origin',
                value: 'https://app.psychsync.com'
              }];

              headers['access-control-allow-credentials'] = [{
                key: 'Access-Control-Allow-Credentials',
                value: 'true'
              }];
            }

            return {
              status: '200',
              headers: headers,
              body: request.body
            };
          };
      Timeout: 5

Outputs:
  CloudFrontDomainName:
    Description: "CloudFront distribution domain name"
    Value: !GetAtt PsychSyncCDNDistribution.DomainName
    Export:
      Name: "PsychSync-CloudFront-Domain"

  S3BucketName:
    Description: "S3 bucket name for static assets"
    Value: !Ref PsychSyncS3Bucket
    Export:
      Name: "PsychSync-S3-Bucket"
