# Prometheus Configuration for PsychSync Security Metrics
# This configuration scrapes security metrics from the PsychSync API

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'psychsync-production'
    environment: 'production'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Rule files
rule_files:
  - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # PsychSync Security Metrics
  - job_name: 'psychsync_security'
    scrape_interval: 5m
    scrape_timeout: 30s
    metrics_path: '/api/v1/monitoring/metrics'
    static_configs:
      - targets:
          - 'localhost:8000'
        labels:
          service: 'psychsync-api'
          team: 'security'

  # PsychSync API Health
  - job_name: 'psychsync_health'
    scrape_interval: 30s
    metrics_path: '/api/v1/health/metrics'
    static_configs:
      - targets:
          - 'localhost:8000'
        labels:
          service: 'psychsync-api'

  # System Metrics (Node Exporter)
  - job_name: 'node_exporter'
    static_configs:
      - targets:
          - 'localhost:9100'
        labels:
          service: 'psychsync-server'

  # PostgreSQL Metrics
  - job_name: 'postgres_exporter'
    static_configs:
      - targets:
          - 'localhost:9187'
        labels:
          service: 'postgresql'

  # Redis Metrics
  - job_name: 'redis_exporter'
    static_configs:
      - targets:
          - 'localhost:9121'
        labels:
          service: 'redis'
