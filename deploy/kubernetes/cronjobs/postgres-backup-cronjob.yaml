#   pagerduty-integration-key: BASE64_ENCODED_PAGERDUTY_KEY
---
################################################################################
# ServiceMonitor for Prometheus metrics (if using Prometheus Operator)
################################################################################
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-backup
  namespace: psychsync
  labels:
    app: postgres-backup
spec:
  selector:
    matchLabels:
      app: postgres-backup
  endpoints:
  - port: metrics
    interval: 30s
    scrapeTimeout: 10s
---
################################################################################
# Prometheus Rules for Backup Monitoring
################################################################################
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgres-backup-alerts
  namespace: psychsync
  labels:
    app: postgres-backup
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
  - name: postgres-backup
    interval: 30s
    rules:
    # Alert if backup job fails
    - alert: PostgreSQLBackupJobFailed
      expr: |
        kube_job_status_failed{namespace="psychsync", job_name=~"postgres-backup-production.*"} > 0
      for: 5m
      labels:
        severity: critical
        component: database
      annotations:
        summary: "PostgreSQL backup job failed"
        description: "PostgreSQL backup job {{ $labels.job_name }} has failed"
        runbook_url: "https://docs.psychsync.com/runbooks/postgres-backup-failed"

    # Alert if backup hasn't run in 8 hours
    - alert: PostgreSQLBackupJobStale
      expr: |
        time() - max(kube_job_status_start_time{namespace="psychsync", job_name=~"postgres-backup-production.*"}) > 28800
      for: 10m
      labels:
        severity: warning
        component: database
      annotations:
        summary: "PostgreSQL backup job hasn't run recently"
        description: "PostgreSQL backup job hasn't run in over 8 hours"
        runbook_url: "https://docs.psychsync.com/runbooks/postgres-backup-stale"

    # Alert if backup job takes longer than 1 hour
    - alert: PostgreSQLBackupJobSlow
      expr: |
        kube_job_status_start_time{namespace="psychsync", job_name=~"postgres-backup-production.*"}
      for: 1h
      labels:
        severity: warning
        component: database
      annotations:
        summary: "PostgreSQL backup job taking too long"
        description: "PostgreSQL backup job {{ $labels.job_name }} has been running for over 1 hour"
        runbook_url: "https://docs.psychsync.com/runbooks/postgres-backup-slow"

    # Alert if backup job success rate drops below 99%
    - alert: PostgreSQLBackupSuccessRateLow
      expr: |
        rate(kube_job_status_complete{namespace="psychsync", job_name=~"postgres-backup-production.*"}[24h])
        /
        (rate(kube_job_status_complete{namespace="psychsync", job_name=~"postgres-backup-production.*"}[24h])
        +
        rate(kube_job_status_failed{namespace="psychsync", job_name=~"postgres-backup-production.*"}[24h]))
        < 0.99
      for: 15m
      labels:
        severity: critical
        component: database
      annotations:
        summary: "PostgreSQL backup success rate is low"
        description: "PostgreSQL backup success rate is below 99% in the last 24 hours"
        runbook_url: "https://docs.psychsync.com/runbooks/postgres-backup-success-rate"
