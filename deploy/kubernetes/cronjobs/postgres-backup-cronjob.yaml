#   namespace: psychsync
# type: Opaque
# data:
#   # Base64 encoded values
#   encryption-key-arn: BASE64_ENCODED_KMS_KEY_ARN
#   aws-role-arn: BASE64_ENCODED_IAM_ROLE_ARN
---
################################################################################
# Secret Template: Notification Secrets
# NOTE: Create this secret manually with actual values
################################################################################
# apiVersion: v1
# kind: Secret
# metadata:
#   name: notification-secrets
#   namespace: psychsync
# type: Opaque
# data:
#   # Base64 encoded values
