---
apiVersion: v1
kind: Namespace
metadata:
  name: psychsync
  labels:
    name: psychsync
    env: production
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: psychsync-backend
  namespace: psychsync
automountServiceAccountToken: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: psychsync-config
  namespace: psychsync
data:
  # Application Configuration
  APP_ENV: "production"
  APP_NAME: "PsychSync"
  DEBUG: "false"
  TESTING: "false"

  # API Configuration
  API_V1_PREFIX: "/api/v1"
  MAX_REQUEST_SIZE: "10485760"  # 10MB

  # CORS Configuration
  CORS_ORIGINS: "https://psychsync.com,https://www.psychsync.com"
  CORS_ALLOW_CREDENTIALS: "true"
  CORS_ALLOW_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
  CORS_ALLOW_HEADERS: "Content-Type,Authorization,X-Requested-With"

  # Security Headers
  SECURE_SSL_REDIRECT: "true"
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_HTTPONLY: "true"
  SESSION_COOKIE_SAMESITE: "Lax"

  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_PER_MINUTE: "60"
  RATE_LIMIT_BURST: "100"

  # Database Configuration (no sensitive data)
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"
  DB_POOL_TIMEOUT: "30"
  DB_POOL_RECYCLE: "3600"

  # Redis Configuration
  REDIS_MAX_CONNECTIONS: "50"
  REDIS_SOCKET_TIMEOUT: "5"
  REDIS_SOCKET_CONNECT_TIMEOUT: "5"

  # Logging Configuration
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  LOG_TO_FILE: "true"
  LOG_FILE_PATH: "/var/log/psychsync/app.log"

  # Monitoring & Tracing
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
  TRACING_SAMPLE_RATE: "0.1"  # 10% sampling

  # Feature Flags
  ENABLE_AI_PROCESSING: "true"
  ENABLE_ASSESSMENTS: "true"
  ENABLE_ANALYTICS: "true"

---
apiVersion: v1
kind: Secret
metadata:
  name: psychsync-secrets
  namespace: psychsync
type: Opaque
stringData:
  # Database Credentials (use external secrets operator in production)
  DATABASE_URL: "postgresql://psychsync:CHANGEME@postgres-psychsync:5432/psychsync"
  DATABASE_USER: "psychsync"
  DATABASE_PASSWORD: "CHANGEME"  # Use External Secrets Operator

  # Redis Credentials
  REDIS_URL: "redis://:CHANGEME@redis-psychsync:6379/0"
  REDIS_PASSWORD: "CHANGEME"

  # JWT Secret (use strong random value)
  JWT_SECRET_KEY: "CHANGEME-use-external-secrets-operator"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"

  # API Keys (external secrets)
  OPENAI_API_KEY: "CHANGEME"
  ANTHROPIC_API_KEY: "CHANGEME"

  # Webhook Secrets
  WEBHOOK_SECRET: "CHANGEME"

  # Email Service (SendGrid/Mailgun)
  EMAIL_API_KEY: "CHANGEME"
  EMAIL_FROM: "noreply@psychsync.com"

  # OAuth Secrets
  OAUTH_GOOGLE_CLIENT_ID: "CHANGEME"
  OAUTH_GOOGLE_CLIENT_SECRET: "CHANGEME"

  # S3/Storage
  AWS_ACCESS_KEY_ID: "CHANGEME"
  AWS_SECRET_ACCESS_KEY: "CHANGEME"
  S3_BUCKET_NAME: "psychsync-production"

  # Encryption Keys
  ENCRYPTION_KEY: "CHANGEME"  # 32-byte key for data encryption

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: psychsync-logs
  namespace: psychsync
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: psychsync-backend
  namespace: psychsync
  labels:
    app: psychsync-backend
    version: v1
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: psychsync-backend
  template:
    metadata:
      labels:
        app: psychsync-backend
        version: v1
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: psychsync-backend
      automountServiceAccountToken: false

      # Security Context for Pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "80"

      # Container Security
      containers:
      - name: backend
        image: psychsync/backend:v1.0.0
        imagePullPolicy: Always

        # Container Security Context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE

        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP

        env:
        # ConfigMap values
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: psychsync-config
              key: APP_ENV
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: psychsync-config
              key: DEBUG
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: psychsync-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: psychsync-secrets
              key: REDIS_URL
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: psychsync-secrets
              key: JWT_SECRET_KEY

        envFrom:
        - configMapRef:
            name: psychsync-config
        - secretRef:
            name: psychsync-secrets

        # Resource Limits (prevents DoS)
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"

        # Health Checks
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 30

        # Lifecycle Hooks
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                # Graceful shutdown
                curl -X POST http://localhost:8000/shutdown
                sleep 10

        # Volume Mounts (read-only except for logs)
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
        - name: logs
          mountPath: /var/log/psychsync
        - name: tmpfs
          mountPath: /app/.cache
          readOnly: true

      # Volumes
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi
      - name: cache
        emptyDir:
          sizeLimit: 500Mi
      - name: logs
        persistentVolumeClaim:
          claimName: psychsync-logs
      - name: tmpfs
        emptyDir:
          medium: Memory
          sizeLimit: 100Mi

      # Affinity (spread pods across nodes)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - psychsync-backend
              topologyKey: kubernetes.io/hostname

        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64

      # Tolerations (control placement)
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "psychsync"
        effect: "NoSchedule"

      # Priority Class (ensure critical pods get resources)
      priorityClassName: high-priority

      # Termination Grace Period
      terminationGracePeriodSeconds: 60

---
apiVersion: v1
kind: Service
metadata:
  name: psychsync-backend
  namespace: psychsync
  labels:
    app: psychsync-backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: psychsync-backend

---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: psychsync-backend-hpa
  namespace: psychsync
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: psychsync-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: psychsync-backend-pdb
  namespace: psychsync
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: psychsync-backend

---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: psychsync-backend
  namespace: psychsync
  labels:
    app: psychsync-backend
spec:
  selector:
    matchLabels:
      app: psychsync-backend
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics
    scheme: http
