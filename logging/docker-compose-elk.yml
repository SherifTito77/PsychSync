# ELK Stack for PsychSync logging
version: '3.8'

services:
  # Elasticsearch - Document storage and search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: psychsync-elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=psychsync-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - elk

  # Logstash - Log processing pipeline
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.1
    container_name: psychsync-logstash
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    ports:
      - "5044:5044"  # Beats input
      - "9600:9600"  # Logstash API
    environment:
      LS_JAVA_OPTS: "-Xmx512m -Xms512m"
    networks:
      - elk
    depends_on:
      - elasticsearch

  # Kibana - Log visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: psychsync-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    networks:
      - elk
    depends_on:
      - elasticsearch

  # Filebeat - Log shipping
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.1
    container_name: psychsync-filebeat
    user: root
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:latest/var/lib/docker/containers:ro
      # ⚠️  SECURITY: Docker socket mount
      # Consider: using read-only (:ro) or specific paths instead
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data:/usr/share/filebeat/data
    environment:
      - output.elasticsearch.hosts=["elasticsearch:9200"]
    networks:
      - elk
    depends_on:
      - elasticsearch

  # Metricbeat - Metrics shipping
  metricbeat:
    image: docker.elastic.co/beats/metricbeat:8.11.1
    container_name: psychsync-metricbeat
    user: root
    volumes:
      - ./metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      # ⚠️  SECURITY: Docker socket mount
      # Consider: using read-only (:ro) or specific paths instead
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:latest/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      # ⚠️  SECURITY: Full root mount detected
      # Consider: using read-only (:ro) or specific paths instead
      - /:/hostfs:ro
    environment:
      - output.elasticsearch.hosts=["elasticsearch:9200"]
    networks:
      - elk
    depends_on:
      - elasticsearch

volumes:
  elasticsearch_data:
    driver: local
  filebeat_data:
    driver: local

networks:
  elk:
    driver: bridge

# Example dashboards and indices to create automatically
# Access Kibana at http://localhost:5601
#
# Useful indices to create:
# - psychsync-logs-* (application logs)
# - psychsync-metrics-* (application metrics)
# - filebeat-* (system logs)
# - metricbeat-* (system metrics)
#
# Example log patterns to monitor:
# - HTTP requests and response times
# - Database queries and performance
# - Authentication and authorization events
# - Error and warning messages
# - Business events (assessments created, teams formed, etc.)
