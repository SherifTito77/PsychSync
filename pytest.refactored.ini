[pytest]
# Pytest configuration for REFACTORED modules only
#
# This configuration runs tests for refactored code WITHOUT the 80% coverage
# requirement, allowing incremental improvement of the codebase.
#
# Usage:
#   pytest -c pytest.refactored.ini tests/scoring/
#   pytest -c pytest.refactored.ini tests/scoring/test_asrs_scorer.py -v

# Test discovery
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting - NO COVERAGE REQUIREMENT
addopts =
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --durations=10
    --maxfail=5
    # Coverage disabled by default - enable with --cov flag
    # NOTE: Uncomment below lines to enable coverage reporting
    # --cov=app
    # --cov-report=html
    # --cov-report=term-missing
    # --cov-report=xml

# Test markers
markers =
    # Refactoring markers
    refactored: Tests for refactored code modules
    complexity: Tests for complexity reduction validation

    # Priority markers
    P0: Critical tests (must pass) - Blocks merge if failed
    P1: High-priority tests - 95% pass rate required
    P2: Medium-priority tests - Monitored but not blocking

    # Type markers
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (database dependencies)

    # Module-specific markers
    scoring: Clinical scoring algorithm tests
    security: Security middleware tests
    middleware: Middleware component tests

# Coverage configuration for refactored modules
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */.venv/*
    */node_modules/*

# Always show coverage for refactored modules
[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Highlight refactored modules in coverage report
[coverage:html]
directory = htmlcov_refactored

[coverage:xml]
output = coverage_refactored.xml
