name: React Performance Linting

on:
  pull_request:
    paths:
      - 'frontend/src/**/*.{ts,tsx}'
      - '.github/workflows/react-performance-lint.yml'
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  performance-lint:
    name: React Performance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint with performance rules
        working-directory: ./frontend
        run: |
          echo "🔍 Running ESLint with React performance rules..."
          npm run lint -- --ext .ts,.tsx --config .eslintrc.react-perf.config.js src/ > eslint-perf-report.json || true
          echo "✅ ESLint completed"

      - name: Analyze performance issues
        working-directory: ./frontend
        run: |
          echo "📊 React Performance Detection Summary"
          echo "======================================"

          # Count issues by type
          INLINE_FUNCTIONS=$(grep -c "react-jsx-no-bind" eslint-perf-report.json 2>/dev/null || echo "0")
          INLINE_STYLES=$(grep -c "inline style" eslint-perf-report.json 2>/dev/null || echo "0")
          HOOKS_DEPS=$(grep -c "exhaustive-deps" eslint-perf-report.json 2>/dev/null || echo "0")

          TOTAL_ISSUES=$((INLINE_FUNCTIONS + INLINE_STYLES + HOOKS_DEPS))

          echo "🔧 Inline functions in JSX: $INLINE_FUNCTIONS"
          echo "🎨 Inline style objects: $INLINE_STYLES"
          echo "🪝 Hook dependency issues: $HOOKS_DEPS"
          echo ""
          echo "📈 Total performance issues: $TOTAL_ISSUES"

          if [ "$TOTAL_ISSUES" -gt 0 ]; then
            echo ""
            echo "❌ Performance issues detected!"
            echo ""
            echo "Top Issues:"
            jq '.[] | select(.messages[].ruleId | contains("react") or contains("jsx")) | {file: .filePath, message: .messages[0].message, rule: .messages[0].ruleId}' eslint-perf-report.json | head -20

            # Calculate impact score
            HIGH_IMPACT=$((INLINE_FUNCTIONS * 10 + INLINE_STYLES * 5))
            echo ""
            echo "📊 Performance Impact Score: $HIGH_IMPACT"
            echo "(Higher score = more re-renders)"

            if [ "$HIGH_IMPACT" -gt 50 ]; then
              echo ""
              echo "🚨 CRITICAL: This will cause major performance issues!"
              exit 1
            elif [ "$HIGH_IMPACT" -gt 20 ]; then
              echo ""
              echo "⚠️  WARNING: Significant performance impact expected"
              exit 1
            fi
          else
            echo ""
            echo "✅ No React performance issues detected!"
          fi

      - name: Generate HTML report
        if: always()
        working-directory: ./frontend
        run: |
          npm run lint -- --ext .ts,.tsx --format html -o react-perf-report.html --config .eslintrc.react-perf.config.js src/ || true
          echo "📄 HTML report generated: react-perf-report.html"

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-performance-lint-report
          path: |
            frontend/eslint-perf-report.json
            frontend/react-perf-report.html
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## ⚡ React Performance Linting Results\n\n';

            try {
              const report = JSON.parse(fs.readFileSync('./frontend/eslint-perf-report.json', 'utf8'));
              const perfIssues = report.filter(r =>
                r.messages.some(m =>
                  m.ruleId && (
                    m.ruleId.includes('react-jsx-no-bind') ||
                    m.ruleId.includes('react-hooks/exhaustive-deps')
                  )
                )
              );

              if (perfIssues.length > 0) {
                comment += `⚠️ **Found ${perfIssues.length} file(s) with React performance issues**\n\n`;

                // Group by issue type
                const inlineFunctions = report.filter(r =>
                  r.messages.some(m => m.ruleId === 'react/jsx-no-bind')
                ).length;

                const hookDeps = report.filter(r =>
                  r.messages.some(m => m.ruleId === 'react-hooks/exhaustive-deps')
                ).length;

                comment += `### Issue Summary\n`;
                comment += `- 🎯 Inline functions: ${inlineFunctions}\n`;
                comment += `- 🪝 Hook dependencies: ${hookDeps}\n\n`;

                comment += `### Files with Issues\n`;
                perfIssues.slice(0, 10).forEach(f => {
                  const msg = f.messages.find(m =>
                    m.ruleId && (
                      m.ruleId.includes('react-jsx-no-bind') ||
                      m.ruleId.includes('react-hooks/exhaustive-deps')
                    )
                  );
                  comment += `**${f.filePath}**\n`;
                  comment += `- Line ${msg.line}: ${msg.message.substring(0, 100)}...\n\n`;
                });

                comment += `\n📚 **See [REACT_PERFORMANCE_FIXES.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/frontend/REACT_PERFORMANCE_FIXES.md) for fixing these issues.**\n`;
              } else {
                comment += '✅ **No React performance issues detected!**\n\n';
                comment += 'All components follow React performance best practices.\n';
                comment += '\n**Checked:**\n';
                comment += '- ✅ No inline functions in JSX props\n';
                comment += '- ✅ Proper hook dependencies\n';
                comment += '- ✅ Memoized handlers and styles\n';
                comment += '- ✅ Optimized re-render behavior\n';
              }
            } catch (error) {
              comment += '⚠️ Could not generate detailed report. Check the workflow logs.\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail on critical issues
        if: always()
        run: |
          if [ -f frontend/eslint-perf-report.json ]; then
            # Count high-impact issues
            ISSUES=$(jq '[.[] | select(.messages[].ruleId | contains("react-jsx-no-bind"))] | length' frontend/eslint-perf-report.json 2>/dev/null || echo "0")
            if [ "$ISSUES" -gt 5 ]; then
              echo "❌ Found $ISSUES high-impact React performance issues"
              exit 1
            fi
          fi
          echo "✅ React performance checks passed!"
