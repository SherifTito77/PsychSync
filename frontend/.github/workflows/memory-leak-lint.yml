name: Memory Leak Detection

on:
  pull_request:
    paths:
      - 'src/**/*.{ts,tsx}'
      - '.github/workflows/memory-leak-lint.yml'
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  memory-leak-detection:
    name: Detect React Memory Leaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint with memory leak rules
        working-directory: ./frontend
        run: |
          echo "🔍 Running ESLint with memory leak detection rules..."
          npm run lint -- --max-warnings=0 --format json > eslint-report.json || true
          echo "✅ ESLint completed"

      - name: Check for memory leak violations
        working-directory: ./frontend
        run: |
          echo "📊 Memory Leak Detection Summary"
          echo "=================================="

          # Count memory leak violations
          TIMER_VIOLATIONS=$(grep -c "no-uncleaned-timers" eslint-report.json || echo "0")
          LISTENER_VIOLATIONS=$(grep -c "no-uncleaned-event-listeners" eslint-report.json || echo "0")
          WEBSOCKET_VIOLATIONS=$(grep -c "no-uncleaned-websockets" eslint-report.json || echo "0")
          SUBSCRIPTION_VIOLATIONS=$(grep -c "no-uncleaned-subscriptions" eslint-report.json || echo "0")

          TOTAL_VIOLATIONS=$((TIMER_VIOLATIONS + LISTENER_VIOLATIONS + WEBSOCKET_VIOLATIONS + SUBSCRIPTION_VIOLATIONS))

          echo "⏰ Timer violations: $TIMER_VIOLATIONS"
          echo "🎧 Event listener violations: $LISTENER_VIOLATIONS"
          echo "📡 WebSocket violations: $WEBSOCKET_VIOLATIONS"
          echo "📮 Subscription violations: $SUBSCRIPTION_VIOLATIONS"
          echo ""
          echo "📈 Total violations: $TOTAL_VIOLATIONS"

          if [ "$TOTAL_VIOLATIONS" -gt 0 ]; then
            echo ""
            echo "❌ Memory leak violations detected!"
            echo "Please fix the following issues:"
            jq '.[] | select(.messages[].ruleId | contains("memory-leak")) | {file: .filePath, messages: [.messages[] | select(.ruleId | contains("memory-leak")) | {rule: .ruleId, message: .message}]}' eslint-report.json
            exit 1
          else
            echo ""
            echo "✅ No memory leak violations found!"
          fi

      - name: Generate HTML report
        if: always()
        working-directory: ./frontend
        run: |
          npm run lint -- --format html -o memory-leak-report.html || true
          echo "📄 HTML report generated: memory-leak-report.html"

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-memory-leak-report
          path: |
            frontend/eslint-report.json
            frontend/memory-leak-report.html
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🔍 Memory Leak Detection Results\n\n';

            try {
              const report = JSON.parse(fs.readFileSync('./frontend/eslint-report.json', 'utf8'));
              const violations = report.filter(r =>
                r.messages.some(m => m.ruleId && m.ruleId.includes('memory-leak'))
              );

              if (violations.length > 0) {
                comment += `❌ **Found ${violations.length} file(s) with memory leak violations**\n\n`;

                violations.forEach(v => {
                  const messages = v.messages.filter(m => m.ruleId && m.ruleId.includes('memory-leak'));
                  comment += `### ${v.filePath}\n`;
                  messages.forEach(m => {
                    comment += `- **${m.ruleId}** (Line ${m.line}): ${m.message}\n`;
                  });
                  comment += '\n';
                });

                comment += `\n📚 See [REACT_EFFECT_CLEANUP_GUIDE.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/frontend/REACT_EFFECT_CLEANUP_GUIDE.md) for fixing these issues.\n`;
              } else {
                comment += '✅ **No memory leak violations detected!**\n\n';
                comment += 'All React useEffect hooks have proper cleanup functions.\n';
              }
            } catch (error) {
              comment += '⚠️ Could not generate detailed report. Check the workflow logs.\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail on violations
        if: always()
        run: |
          if [ -f frontend/eslint-report.json ]; then
            VIOLATIONS=$(jq '[.[] | select(.messages[].ruleId | contains("memory-leak"))] | length' frontend/eslint-report.json)
            if [ "$VIOLATIONS" -gt 0 ]; then
              echo "❌ Found $VIOLATIONS file(s) with memory leak violations"
              exit 1
            fi
          fi
          echo "✅ All checks passed!"

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript type check
        working-directory: ./frontend
        run: npm run type-check

      - name: Upload type check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-errors
          path: frontend/
          retention-days: 7
