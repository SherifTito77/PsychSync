name: Memory Leak Prevention - Complete Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 9 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  ###############################################################################
  # JOB 1: Memory Leak Detection
  ###############################################################################

  memory-leak-check:
    name: 🔍 Memory Leak Detection
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 💾 Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🔍 Run ESLint Memory Leak Scan
        id: eslint-scan
        working-directory: ./frontend
        run: |
          echo "Running ESLint memory leak scan..."
          npm run lint 2>&1 | tee eslint-output.txt

          # Count memory leaks
          MEM_LEAK_COUNT=$(grep -c "memory-leak" eslint-output.txt || echo "0")
          TIMER_COUNT=$(grep -c "no-uncleaned-timers" eslint-output.txt || echo "0")
          EVENT_COUNT=$(grep -c "no-uncleaned-event-listeners" eslint-output.txt || echo "0")
          WS_COUNT=$(grep -c "no-uncleaned-websockets" eslint-output.txt || echo "0")
          SUB_COUNT=$(grep -c "no-uncleaned-subscriptions" eslint-output.txt || echo "0")

          echo "memory_leak_count=$MEM_LEAK_COUNT" >> $GITHUB_OUTPUT
          echo "timer_count=$TIMER_COUNT" >> $GITHUB_OUTPUT
          echo "event_count=$EVENT_COUNT" >> $GITHUB_OUTPUT
          echo "websocket_count=$WS_COUNT" >> $GITHUB_OUTPUT
          echo "subscription_count=$SUB_COUNT" >> $GITHUB_OUTPUT

          echo "### 🔍 Memory Leak Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Type | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **$MEM_LEAK_COUNT** |" >> $GITHUB_STEP_SUMMARY
          echo "| Timer Leaks | $TIMER_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Event Leaks | $EVENT_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| WebSocket Leaks | $WS_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Subscription Leaks | $SUB_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$MEM_LEAK_COUNT" -gt "0" ]; then
            echo "#### ❌ Memory Leaks Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep "memory-leak" eslint-output.txt | head -20 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 💡 How to Fix" >> $GITHUB_STEP_SUMMARY
            echo "1. Read: \`frontend/ULTIMATE_QUICK_START.md\`" >> $GITHUB_STEP_SUMMARY
            echo "2. Use hooks from: \`@/hooks/cleanupHooks\`" >> $GITHUB_STEP_SUMMARY
            echo "3. Run: \`npm run lint | grep memory-leak\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "#### ✅ No Memory Leaks Detected!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📊 Upload Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-scan-results
          path: frontend/eslint-output.txt
          retention-days: 30

      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const leakCount = '${{ steps.eslint-scan.outputs.memory_leak_count }}';
            const timerCount = '${{ steps.eslint-scan.outputs.timer_count }}';
            const eventCount = '${{ steps.eslint-scan.outputs.event_count }}';
            const wsCount = '${{ steps.eslint-scan.outputs.websocket_count }}';
            const subCount = '${{ steps.eslint-scan.outputs.subscription_count }}';

            const comment = `### 🔍 Memory Leak Prevention Report

            **Scan Results:**

            | Type | Count |
            |------|-------|
            | **Total** | **${leakCount}** |
            | Timer Leaks | ${timerCount} |
            | Event Leaks | ${eventCount} |
            | WebSocket Leaks | ${wsCount} |
            | Subscription Leaks | ${subCount} |

            ${leakCount > 0 ? `
            ### ❌ Action Required

            Memory leaks were detected in this PR. Please fix them before merging.

            **Quick Fix:**
            1. Read \`frontend/ULTIMATE_QUICK_START.md\` (10 min)
            2. Use hooks from \`@/hooks/cleanupHooks\`
            3. Run \`npm run lint | grep memory-leak\` locally

            **Resources:**
            - Quick Start: \`frontend/ULTIMATE_QUICK_START.md\`
            - Reference: \`frontend/QUICK_REFERENCE_CARD.md\`
            - Training: \`frontend/TEAM_TRAINING_MEMORY_LEAKS.md\`
            ` : `
            ### ✅ No Memory Leaks Detected!

            Great job! Your code is memory-safe. 🎉
            `}

            ---
            <em>Automated check by Memory Leak Prevention System</em>
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  ###############################################################################
  # JOB 2: Type Checking
  ###############################################################################

  type-check:
    name: 🔎 Type Checking
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 💾 Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🔎 Run TypeScript Type Check
        working-directory: ./frontend
        run: |
          echo "Running TypeScript type check..."
          npm run type-check 2>&1 | tee typecheck-output.txt

          echo "### 🔎 Type Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $? -eq 0 ]; then
            echo "#### ✅ No Type Errors" >> $GITHUB_STEP_SUMMARY
          else
            echo "#### ❌ Type Errors Found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat typecheck-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  ###############################################################################
  # JOB 3: Test Suite
  ###############################################################################

  test-suite:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 💾 Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🧪 Run Test Suite
        id: tests
        working-directory: ./frontend
        run: |
          echo "Running test suite..."
          npm test -- --run --reporter=verbose 2>&1 | tee test-output.txt

          # Parse results
          PASS_COUNT=$(grep -o "[0-9]* passed" test-output.txt | head -1 | grep -o "[0-9]*" || echo "0")
          FAIL_COUNT=$(grep -o "[0-9]* failed" test-output.txt | head -1 | grep -o "[0-9]*" || echo "0")

          echo "pass_count=$PASS_COUNT" >> $GITHUB_OUTPUT
          echo "fail_count=$FAIL_COUNT" >> $GITHUB_OUTPUT

          echo "### 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Passed** | **✅ $PASS_COUNT** |" >> $GITHUB_STEP_SUMMARY
          echo "| **Failed** | **❌ $FAIL_COUNT** |" >> $GITHUB_STEP_SUMMARY

          TOTAL=$((PASS_COUNT + FAIL_COUNT))
          if [ $TOTAL -gt 0 ]; then
            PASS_RATE=$((PASS_COUNT * 100 / TOTAL))
            echo "| **Pass Rate** | **$PASS_RATE%** |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $FAIL_COUNT -gt 0 ]; then
            echo "#### ❌ Some Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A 5 "FAIL" test-output.txt | head -50 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "#### ✅ All Tests Passed!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📊 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: frontend/test-output.txt
          retention-days: 30

  ###############################################################################
  # JOB 4: Build Verification
  ###############################################################################

  build-verify:
    name: 🏗️ Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 💾 Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Build Project
        id: build
        working-directory: ./frontend
        run: |
          echo "Building project..."
          npm run build 2>&1 | tee build-output.txt

          echo "### 🏗️ Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $? -eq 0 ]; then
            echo "#### ✅ Build Successful" >> $GITHUB_STEP_SUMMARY

            # Calculate bundle size
            if [ -d "dist" ]; then
              SIZE=$(du -sh dist | cut -f1)
              echo "Bundle Size: $SIZE" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "#### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 build-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: 📦 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-artifacts
          path: frontend/dist
          retention-days: 7

  ###############################################################################
  # JOB 5: Dashboard Generation (Scheduled)
  ###############################################################################

  generate-dashboard:
    name: 📊 Generate Dashboard
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 💾 Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 📊 Generate Dashboard
        working-directory: ./frontend
        run: |
          if [ -f "scripts/generate-memory-leak-dashboard.sh" ]; then
            bash scripts/generate-memory-leak-dashboard.sh
          else
            echo "Dashboard script not found, skipping..."
          fi

      - name: 📤 Upload Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: memory-leak-dashboard
          path: frontend/MEMORY_LEAK_DASHBOARD_*.html
          retention-days: 90

  ###############################################################################
  # JOB 6: Complete Pipeline Report
  ###############################################################################

  pipeline-report:
    name: 📋 Pipeline Report
    runs-on: ubuntu-latest
    needs: [memory-leak-check, type-check, test-suite, build-verify]
    if: always()

    steps:
      - name: 📋 Generate Pipeline Report
        run: |
          echo "### 📋 Memory Leak Prevention Pipeline Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "#### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Memory Leak Detection | ${{ needs.memory-leak-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Checking | ${{ needs.type-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | ${{ needs.test-suite.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Verification | ${{ needs.build-verify.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status
          if [[ "${{ needs.memory-leak-check.result }}" == "success" ]] && \
             [[ "${{ needs.type-check.result }}" == "success" ]] && \
             [[ "${{ needs.test-suite.result }}" == "success" ]] && \
             [[ "${{ needs.build-verify.result }}" == "success" ]]; then
            echo "#### ✅ Pipeline Passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All checks passed successfully. Your code is ready for production! 🎉" >> $GITHUB_STEP_SUMMARY
          else
            echo "#### ❌ Pipeline Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Some checks failed. Please review the job details above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  ###############################################################################
  # JOB 7: Security & Performance Monitoring
  ###############################################################################

  security-monitor:
    name: 🔒 Security Monitor
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 💾 Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🔒 Run Security Audit
        working-directory: ./frontend
        run: |
          echo "Running security audit..."
          npm audit --audit-level=moderate 2>&1 | tee security-output.txt || true

          echo "### 🔒 Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          VULNERABILITIES=$(grep -c "vulnerabilities" security-output.txt || echo "0")

          if [ "$VULNERABILITIES" -eq "0" ]; then
            echo "#### ✅ No Vulnerabilities Found" >> $GITHUB_STEP_SUMMARY
          else
            echo "#### ⚠️ Vulnerabilities Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat security-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📈 Check Bundle Size
        working-directory: ./frontend
        run: |
          echo "Analyzing bundle size..."
          npm run build 2>&1 | tee build-output.txt || true

          echo "### 📈 Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d "dist" ]; then
            echo "#### 📦 Build Artifacts" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            du -sh dist/* 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || echo "No artifacts found"
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
