[pytest]
# Comprehensive pytest configuration for PsychSync

# Test discovery
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting and coverage
addopts =
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
    --durations=10
    --maxfail=5
    --capture=no

# Comprehensive test markers
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (database dependencies)
    e2e: End-to-end tests (full API workflow)
    slow: Tests that take longer to run (> 5 seconds)
    performance: Performance and load testing
    auth: Authentication and authorization tests
    comprehensive: Comprehensive test suites covering edge cases
    cache: Cache-related tests
    redis: Redis-dependent tests
    security: Security-related tests
    database: Database-specific tests
    api: API endpoint tests
    service: Service layer tests
    model: Model tests
    schema: Schema validation tests

# Async configuration
asyncio_mode = auto

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Logging configuration (useful for debugging)
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Minimum pytest version
minversion = 6.0
